<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DB Map</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003F2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#003F2D;--green2:#0B6B4E;--paper:#EEF1EE;--ink:#15201C;--muted:#5A6862;--line:#C9D1CC;
--grey:#7C8A84;--amber:#D98200;--ok:#1E8A4C;--red:#C8261E;--tag:#FFD200}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Barlow,system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{display:flex;flex-direction:column;height:100dvh}
header{background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:54px;flex:none}
header h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:6px;padding:6px 10px;font-weight:600;white-space:nowrap}
.mapsel{flex:1;min-width:0;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px}
.mapsel option{color:#000;font-family:Barlow,sans-serif;font-size:16px}
#saved{font-size:13px;opacity:0;transition:opacity .3s;color:#BFE3D2}
#saved.on{opacity:1}
main{flex:1;overflow:auto;position:relative}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 40px}
h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;margin:22px 0 8px;color:var(--green)}
h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;margin:18px 0 2px;color:var(--green2)}
.muted{color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--green);background:#fff;color:var(--green);border-radius:6px;padding:9px 14px;font-weight:700;text-decoration:none}
.btn.primary{background:var(--green);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:5px 10px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff;font-size:16px}
select[disabled]{background:#F3F5F4;color:var(--muted)}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
input[type=date]{min-width:0;max-width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:600;font-size:15px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px}
.summary span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mapcard{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mapcard img{width:100%;height:96px;object-fit:contain;background:#fff;border-radius:4px}
.mapcard strong{font-size:15px;line-height:1.2}
.mapcard small{color:var(--muted);font-size:13px}
.mapcard.add{align-items:center;justify-content:center;border-style:dashed;border-color:var(--green2);color:var(--green);font-weight:700;min-height:150px;text-align:center}
.wkrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-left-width:6px;border-radius:6px;padding:8px 10px;margin-bottom:6px}
.wkrow b{font-family:'Barlow Condensed';font-size:16px;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkrow span{flex:1;font-size:14px;color:var(--muted);min-width:0}
.wkrow em{font-style:normal;font-weight:600;font-size:13px;white-space:nowrap}

/* map */
.vp{position:absolute;inset:0;overflow:auto;display:flex;
 background-color:#E3E8E4;background-image:linear-gradient(rgba(0,63,45,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,63,45,.07) 1px,transparent 1px);background-size:24px 24px}
.canvas{position:relative;margin:auto;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25);background:#fff}
.canvas img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.canvas.placing{cursor:crosshair}
.canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.canvas svg .hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:stroke;cursor:pointer}
.canvas.placing svg .hit{pointer-events:none}
.canvas svg .cab{fill:none;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.canvas svg .cab.sel{stroke-width:6}
.canvas svg .bond2{fill:none;stroke:#F2C400;stroke-width:3.5;stroke-dasharray:6 6}
.canvas svg .bond2.sel{stroke-width:6}
.canvas svg .preview{fill:none;stroke:#000;stroke-width:3;stroke-dasharray:6 4}
.canvas svg .vtx{fill:#fff;stroke:#000;stroke-width:2}
.clab{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;line-height:1;padding:2px 4px;border-radius:3px;color:#fff;white-space:nowrap;pointer-events:none;z-index:1;box-shadow:0 0 0 1.5px #fff}
.pin{position:absolute;transform:translate(-50%,-15px);padding:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;z-index:2}
.unlocked .pin{touch-action:none;cursor:grab}
.pin .n{min-width:30px;height:30px;padding:0 5px;border-radius:5px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.3)}
.pin .l{margin-top:3px;background:var(--tag);color:#000;border:1.5px solid #000;border-radius:3px;font-size:11px;font-weight:700;line-height:1;padding:2px 4px 1px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.pin .l.none{background:#fff;color:var(--muted);border-style:dashed}
.pin .r6{position:absolute;top:-7px;right:-9px;background:#fff;color:var(--red);border:1.5px solid var(--red);border-radius:8px;font-size:9px;font-weight:700;padding:1px 3px;line-height:1}
.pin.sel{z-index:4}
.pin.sel .n{box-shadow:0 0 0 3px var(--tag),0 0 0 5px #000}
.pin.drag{z-index:5;opacity:.85}
.pin.target .n{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--green2)}
.tools{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5;flex-wrap:wrap}
.tools>*{pointer-events:auto}
.tgrp{display:flex;gap:8px}
.tool{background:var(--green);color:#fff;border:0;border-radius:24px;padding:11px 16px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.tool.on{background:var(--tag);color:#000;outline:2px solid #000}
.tool.alt{background:#fff;color:var(--green)}
.zoom{display:flex;background:#fff;border-radius:24px;box-shadow:0 3px 10px rgba(0,0,0,.25);overflow:hidden}
.zoom button{border:0;background:#fff;min-width:44px;height:44px;font-weight:700;font-size:18px}
.zoom button+button{border-left:1px solid var(--line)}
.banner{position:absolute;top:10px;left:10px;right:10px;z-index:6;background:var(--tag);border:2px solid #000;border-radius:8px;padding:9px 12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner span{flex:1 1 180px;font-size:15px;line-height:1.3}
.banner button{border:0;background:#000;color:#fff;border-radius:5px;padding:6px 10px;font-weight:600}
.banner button.go{background:var(--green)}
.loading{margin:auto;color:var(--muted);font-weight:600}
.legend{position:absolute;top:10px;right:10px;z-index:4;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:3px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i.ln{width:16px;height:4px;border-radius:2px;display:inline-block}
.legend button{border:0;background:none;padding:2px 0;font-weight:700;color:var(--green2);font-size:13px;text-align:left}

/* sheet */
.sheet.still{animation:none}
.sym{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;background:none;z-index:3;line-height:0;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.sym.sel svg{outline:3px solid var(--tag);outline-offset:1px;border-radius:50%}
.unlocked .sym{touch-action:none;cursor:grab}
.canvas .sym svg{position:static;width:24px;height:24px;overflow:visible;pointer-events:none}
.pal{position:absolute;left:8px;right:8px;bottom:68px;z-index:6;background:#fff;border:1.5px solid var(--line);border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.2);display:flex;gap:4px;overflow-x:auto;padding:6px}
.pal button{flex:none;border:2px solid transparent;background:#fff;border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;width:70px;line-height:1.1;text-align:center}
.pal button.on{border-color:var(--green);background:#E8F5EE}
.tv-wrap{overflow:auto;border:1.5px solid var(--line);border-radius:8px;background:#FAFBFA;margin-top:10px;max-height:68vh;-webkit-overflow-scrolling:touch}
.tv{position:absolute;left:0;top:0;transform-origin:0 0}
.tv svg{position:absolute;left:0;top:0;overflow:visible}
.tv path{fill:none;stroke:#8FA39A;stroke-width:2}
.tn{position:absolute;width:150px;height:58px;display:flex;align-items:stretch;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:0;text-align:left;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tn i{width:7px;flex:none}
.tn span{padding:5px 8px;font-size:12px;line-height:1.25;overflow:hidden;color:var(--muted)}
.tn span em{font-style:normal;color:var(--amber);font-weight:600}
.tn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.tn.root{background:var(--green);border-color:var(--green)}
.tn.root span{color:#BFE3D2}.tn.root b{color:#fff}
.sitebar{font-size:14px;color:var(--muted);margin:0 0 10px}
#printwrap{display:none}
@media print{body.printing .app,body.printing #ovl,body.printing #toastbox{display:none!important}body.printing #printwrap{display:grid;grid-template-columns:1fr 1fr;gap:6mm}body.printing #printwrap img{width:100%;break-inside:avoid}body.printing #printwrap.rep{display:block}}
.savebtn.dirty{background:var(--tag);color:#000;border-color:var(--tag)}
.tog{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin-top:12px}
.tog input{width:20px;height:20px;accent-color:var(--green)}
.chg{display:inline-block;background:#FFF4D6;color:#8A5300;border:1px solid var(--amber);border-radius:4px;font-size:11px;font-weight:700;padding:0 4px;margin-left:4px;vertical-align:middle}
.who{background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--grey);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.who b{font-size:16px}
.who .meta{font-size:14px;color:var(--muted);line-height:1.4;margin:2px 0 6px}
.prow{background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.prow .t{font-size:14px;line-height:1.35;margin-bottom:6px}
.prow select{padding:6px 8px;font-size:15px}
.remc{background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--grey);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:14px;line-height:1.45}
.remc .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.remc .code{font-family:'Barlow Condensed';font-weight:700;font-size:18px;color:#fff;border-radius:4px;padding:0 6px;flex:none}
.remc .top select{flex:1;padding:6px 8px}
.remc .lnk{border:0;background:none;padding:0;color:var(--green2);font-weight:700;text-align:left;font-size:15px}
.remc details{margin-top:6px;border-top:1px solid #E4E9E5;padding-top:4px}
.mailrow{display:flex;gap:6px;margin-top:6px}
.remind{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0}
.mailrow input{flex:1}
.pg{font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 2px}
.venue{margin:18px 0 8px;padding-bottom:2px;border-bottom:2px solid var(--green)}
.venue h3{margin:0 0 2px;color:var(--green);font-size:18px}
.venue .sub{font-size:13px;color:var(--muted)}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 10px}
.vbar .sel{font-size:13px;font-weight:600;color:var(--muted);margin-right:auto}
.vbar a,.vbar button.lnk2{border:0;background:none;color:var(--green2);font-weight:700;font-size:13px;padding:4px 0}
.remc .top label{display:flex;align-items:center;gap:6px;font-size:0}
.remc .top input[type=checkbox]{width:19px;height:19px;accent-color:var(--green)}
.remc summary{cursor:pointer;font-weight:700;color:var(--green);padding:4px 0}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:14px;border-left:2px solid var(--line)}
.tree li{position:relative;margin:6px 0}
.tree ul>li::before{content:'';position:absolute;left:-14px;top:22px;width:14px;border-top:2px solid var(--line)}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px;line-height:1.3}
.node .dot{width:12px;height:12px}
.node b{font-size:15px}
.node small{display:block;color:var(--muted)}
.node.root{background:var(--green);color:#fff;border-color:var(--green)}
.node.root small{color:#BFE3D2}
.airow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #E4E9E5;font-size:14px;line-height:1.35}
.airow input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--green)}

.sheet.cable{max-height:56%}
.vh{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:3px solid #000;touch-action:none;z-index:7;padding:0;cursor:move;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vh.drag{background:var(--tag)}
.eng{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.eng b{font-size:17px}
.eng .meta{font-size:14px;color:var(--muted);line-height:1.5;margin:2px 0 8px;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;background:#fff;border-top:3px solid var(--green);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);z-index:10;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.bign{min-width:40px;height:40px;padding:0 6px;border-radius:6px;color:#fff;font-family:'Barlow Condensed';font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.shead .st{flex:1;min-width:0;font-size:14px;line-height:1.3}
.shead .st b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close{border:0;background:var(--paper);border-radius:6px;padding:7px 11px;font-weight:600}
.tabs{display:flex;border-bottom:1.5px solid var(--line);padding:0 4px}
.tabs button{flex:1;border:0;background:none;padding:10px 2px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;font-size:15px}
.tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.sbody{overflow:auto;padding:4px 14px 26px}
.card{background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:14px;line-height:1.5}
.card b{font-size:15px}
.fld{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #E4E9E5}
.fld span{font-size:15px;line-height:1.25}
.fld select,.fld input{padding:7px 8px}
select.bad{border-color:var(--red);background:#FDECEA;color:var(--red);font-weight:600}
select.good{border-color:var(--ok);background:#E8F5EE}
.res{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:7px 10px;margin-top:6px;font-size:14px}
.res b{font-size:15px}
.photos{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.photos button.ph{flex:none;width:110px;height:82px;border:1.5px solid var(--line);border-radius:6px;padding:0;overflow:hidden;background:#fff}
.photos button.ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos label{flex:none;width:110px;height:82px;border:2px dashed var(--green2);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:var(--green);font-size:14px;cursor:pointer;padding:6px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px}
.item .sw{width:8px;align-self:stretch;border-radius:3px;flex:none}
.item span{flex:1;font-size:14px;line-height:1.35;min-width:0}
.item span b{font-size:15px}
.item em{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
.edit{border:1.5px solid var(--green2);border-radius:8px;padding:4px 12px 12px;margin-top:8px;background:#F7FAF8}
.rem{border:1.5px solid var(--line);border-left:6px solid var(--grey);border-radius:8px;padding:4px 10px 10px;margin-top:10px;background:#fff}
.diag{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #E4E9E5}
.diag .th{width:64px;height:48px;border:1px solid var(--line);border-radius:4px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--red);background:#fff}
.diag span{flex:1;font-size:15px;word-break:break-word}
.ov{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column}
.ov.dark{background:#1a1f1d}
.ov .body{flex:1;overflow:auto}
.viewer{flex:1;overflow:auto;display:flex}
.viewer img{margin:auto;max-width:100%;display:block;background:#fff}
.viewer img.full{max-width:none}
.viewer object{width:100%;height:100%;border:0;background:#fff}
.lrow{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;text-align:left}
.lrow .bign{min-width:34px;height:34px;font-size:18px;flex:none}
.lrow span{flex:1;font-size:14px;min-width:0}
.lrow small{display:block;color:var(--muted)}
.calrow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.calrow span{flex:1;font-size:14px}
.calrow a{font-weight:700;color:var(--green);font-size:14px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center}

<body>
<div class="app"><header id="hdr"></header><main id="main"><div class="wrap"><p class="muted">Loading…</p></div></main></div>
<div id="ovl"></div><div id="toastbox"></div>
<script>
let BUILTIN=[];
let SCHED=null;
const DEFAULT_SITE='';
</script>
<script>
/* ============ reference data ============ */
let ENG=[],BLD=[],WEEKS={},SCHED_DBS=[];
function loadSchedule(sc){SCHED=sc&&sc.r?sc:{b:[],e:[],w:{},r:[]};ENG=SCHED.e.filter(Boolean);BLD=SCHED.b;WEEKS=SCHED.w||{};
  SCHED_DBS=SCHED.r.map(r=>{const parts=String(r[1]).split(/\s{2,}/);return{asset:r[0],name:r[1],ref:parts[parts.length-1],building:BLD[r[2]],floor:r[3],room:r[4],engineer:SCHED.e[r[5]]||'',wk:r[6]}})}
loadSchedule(SCHED);
let DBS=[], BY_ASSET={};
function rebuildDbs(){const ov=data.engOverride||{},wo=data.weekOverride||{},ed=data.dbEdits||{};
  DBS=[...SCHED_DBS,...(data.customDbs||[])].map(d=>{if(ed[d.asset]&&!d.custom)d={...d,...ed[d.asset],edited:true};const e=ov[d.asset],w=wo[d.asset];if(e===undefined&&w===undefined)return d;
    return{...d,engineer:e!==undefined?e:d.engineer,wk:w!==undefined?w:d.wk,changed:(e!==undefined&&e!==d.engineer)||(w!==undefined&&w!==d.wk)}});
  BY_ASSET=Object.fromEntries(DBS.map(d=>[d.asset,d]))}
const engId=n=>'eng_'+String(n).toLowerCase().replace(/[^a-z0-9]+/g,'_');
const EPAL=['#1565C0','#C2185B','#00897B','#EF6C00','#5E35B1','#6D4C41','#0097A7','#7CB342','#AD1457','#455A64'];
const engColor=n=>{const i=engNames().indexOf(n);return i<0?'#9AA5A0':EPAL[i%EPAL.length]};
const REM_STATUS=['Open','Quoted','Approved','Completed'];
const REM_COL={Open:'var(--red)',Quoted:'var(--amber)',Approved:'#1565C0',Completed:'var(--ok)'};
function parentOf(a){return (data.parents||{})[a]||''}
function childrenOf(a){return Object.keys(data.parents||{}).filter(k=>data.parents[k]===a)}
function isDesc(anc,node){let n=node,guard=0;while(n&&guard++<500){n=parentOf(n);if(n===anc)return true}return false}
const engNames=()=>[...(data.engineers||[])].sort((a,b)=>(a.o??1e9)-(b.o??1e9)).map(e=>e.name);
const engByName=n=>(data.engineers||[]).find(e=>e.name===n);
const engOpts=(sel,blank)=>{const names=engNames();if(sel&&!names.includes(sel))names.push(sel);return opts(names,sel,blank)};

const OK=['OK','Not OK','N/A'], YN=['Yes','No','N/A'];
const IR=['>999','>500','>299','>200','>100','>50','>20','>10','>2','1 – 2','<1 (fail)','Not tested'];
const CODES=[['C1','C1 – Danger present'],['C2','C2 – Potentially dangerous'],['C3','C3 – Improvement recommended'],['FI','FI – Further investigation']];
const FAULTS=['None',...CODES.map(c=>c[1])];
const ACTIONS=['Completed on site','Quote required','Parts on order','Isolated and made safe','Referred to supervisor','Monitor at next inspection'];
const RCD6=['Pass','Fail','N/A – no RCD'];
const FIELDS=[
 {k:'N',g:'Visual',l:'External enclosure OK',o:OK},{k:'O',l:'Internal clean OK',o:OK},{k:'P',l:'Cable entries OK',o:OK},
 {k:'Q',l:'Wiring / insulation OK',o:OK},{k:'R',l:'Busbars OK',o:OK},{k:'S',l:'Labelling / schedule OK',o:OK},
 {k:'T',g:'Electrical',l:'Connections tightened',o:YN},{k:'U',l:'IR test (MΩ)',o:IR},{k:'V',l:'Earth continuity OK',o:OK},
 {k:'W',l:'RCD/RCBO test OK',o:OK},{k:'X',l:'Thermal imaging OK',o:OK},{k:'Y',l:'Load current (A)',t:'text',ph:'e.g. 12 or 12/15/9'},
 {k:'Z',l:'Voltage check OK',o:OK},
 {k:'AA',g:'Component',l:'Circuit breakers OK',o:OK},{k:'AB',l:'Protective devices OK',o:OK},{k:'AC',l:'Earthing system OK',o:OK},
 {k:'AF',g:'Documentation',l:'Engineer sign-off',eng:true},
];
const HEADERS_AF=['Wk','W/C (Mon)','W/E (Fri)','Engineer','Asset Code','DB Name','Building','Floor','Room','Phase','Voltage','Safe Isolation Confirmed','PPE Worn',
 'External Enclosure OK','Internal Clean OK','Cable Entries OK','Wiring / Insulation OK','Busbars OK','Labelling / Schedule OK','Connections Tightened','IR Test (MΩ)','Earth Continuity OK','RCD/RCBO Test OK','Thermal Imaging OK','Load Current (A)','Voltage Check OK','Circuit Breakers OK','Protective Devices OK','Earthing System OK','Faults Found','Remedial Actions','Engineer Sign-off'];
const COLS_NAF=['N','O','P','Q','R','S','T','U','V','W','X','Y','Z','AA','AB','AC','AD','AE','AF'];

/* Regulation references: BS 7671:2018 numbering. Check against the current amendment before issuing. */
const REGS=[
 ['132.12','Equipment not accessible for operation, inspection or maintenance'],
 ['134.1.1','Poor workmanship or unsuitable materials'],
 ['411.3.1.1','Exposed-conductive-part not connected to protective conductor'],
 ['411.3.1.2','Protective equipotential bonding missing or inadequate'],
 ['411.3.2','Disconnection time not met (Zs too high)'],
 ['411.3.3','No 30 mA RCD on socket-outlets up to 32 A'],
 ['411.3.4','No RCD on domestic lighting circuits'],
 ['416.2.1','Enclosure below IPXXB / IP2X (missing blanks, open ways)'],
 ['416.2.2','Top of enclosure below IPXXD / IP4X'],
 ['421.1.201','Domestic consumer unit not non-combustible'],
 ['433.1','Overload device not coordinated with cable'],
 ['434.5.1','Breaking capacity below prospective fault current'],
 ['512.2','Equipment unsuitable for external influences (IP rating)'],
 ['514.9.1','Circuit chart missing or out of date'],
 ['514.11.1','No warning where more than one supply'],
 ['514.12.1','Periodic inspection notice missing'],
 ['514.12.2','RCD test notice missing'],
 ['514.13.1','Earthing or bonding label missing'],
 ['514.14.1','Mixed wiring colours notice missing'],
 ['522.6.202','Concealed cables in wall without RCD or earthed covering'],
 ['522.8.1','Cable damaged or exposed to mechanical damage'],
 ['526.1','Loose or poor connection'],
 ['526.5','Connections not enclosed'],
 ['527.2.1','Fire-stopping missing at penetration'],
 ['537.2','Isolation device missing or unsuitable'],
 ['543.1.1','Protective conductor undersized'],
 ['544.1.1','Main bonding conductor undersized'],
 ['643.3','Insulation resistance below Table 64 minimum'],
];
const CTYPES=[['lighting','Lighting','#1565C0'],['power','Power','#C8261E'],['bonding','Bonding / earthing','#2E7D32'],['submain','Sub-main / feed','#6A1B9A'],['emergency','Emergency lighting','#E07B00'],['other','Other','#455A64']];
const CT=Object.fromEntries(CTYPES.map(([k,l,c])=>[k,{l,c}]));
const CABLES=['6242Y twin & earth','6243Y 3-core & earth','SWA 2-core','SWA 3-core','SWA 4-core','SWA 5-core','LSZH singles (6491B)','FP200 / fire resistant','MICC mineral insulated','H07RN-F flex','SY / CY control','Green/yellow single (bonding)','Other'];
const SIZES=['1.0','1.5','2.5','4','6','10','16','25','35','50','70','95','120','150','185','240'];
const DEVICES=['MCB','RCBO','MCCB','BS 88 fuse','BS 1361 fuse','BS 3036 rewireable','Isolator / switch','Spare'];
const CURVES=['B','C','D','–'];
const RATINGS=['3','5','6','10','13','16','20','25','32','40','45','50','63','80','100','125','160','200','250'];
const RCDS=['30 mA RCBO','Via 30 mA RCD','Via 100 mA RCD','Via 300 mA RCD','None'];
const POWERS=['Sockets – ring','Sockets – radial','Lighting','Emergency lighting','Cooker','Water heater','Hand dryers','Extract fan','Air conditioning','Fire alarm panel','Sub-DB','Main bonding – water','Main bonding – gas','Supplementary bonding','Kitchen equipment','External lighting','Signage','Door access','Data cabinet'];

/* ============ storage ============ */
const KEY='dbmap:data', KIMG='dbmap:img:', KFILE='dbmap:diag:';
const inClaude=!!(window.storage&&window.storage.get), mem={};
const idb=(!inClaude&&window.indexedDB)?new Promise(res=>{const r=indexedDB.open('dbmap',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}):Promise.resolve(null);
const hasStore=inClaude||!!window.indexedDB;
function idbDo(mode,fn){return idb.then(db=>db?new Promise((res,rej)=>{const t=db.transaction('kv',mode),st=t.objectStore('kv'),q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}):null)}
async function sget(k){if(inClaude){try{const r=await window.storage.get(k,false);return r?r.value:null}catch(e){return null}}try{const db=await idb;if(db){const v=await idbDo('readonly',st=>st.get(k));return v??null}}catch(e){}return mem[k]??null}
async function sset(k,v){if(inClaude){try{return !!(await window.storage.set(k,v,false))}catch(e){console.error(e);return false}}try{const db=await idb;if(db){await idbDo('readwrite',st=>st.put(v,k));return true}}catch(e){console.error(e);return false}mem[k]=v;return true}
async function sdel(k){if(inClaude){try{await window.storage.delete(k,false)}catch(e){}return}try{const db=await idb;if(db){await idbDo('readwrite',st=>st.delete(k));return}}catch(e){}delete mem[k]}
let data={maps:{},custom:[],customDbs:[],engineers:[],engOverride:{},weekOverride:{},parents:{},dbEdits:{},mapBuilding:{},site:{},kvu:{},tomb:{},settings:{autosave:true}};
let CLOUD=null,SYNC={busy:false,last:0,err:'',t:null},PENDING=[],SNAP=null;
let saveT=null,dirty=false;
const SB=()=>`<button class="hbtn savebtn" onclick="saveNow()">Saved</button>`;
function updateSaveBtn(){const t=dirty?'Save':CLOUD?(SYNC.busy?'Syncing…':SYNC.err?'Offline':'Synced'):'Saved';document.querySelectorAll('.savebtn').forEach(b=>{b.classList.toggle('dirty',dirty||(!!CLOUD&&!!SYNC.err));b.textContent=t;b.setAttribute('aria-label',dirty?'Save changes':t)})}
function scheduleSave(){dirty=true;updateSaveBtn();if((data.settings||{}).autosave!==false){clearTimeout(saveT);saveT=setTimeout(saveData,600)}}
async function saveNow(){clearTimeout(saveT);const ok=await saveData();if(CLOUD){clearTimeout(SYNC.t);await syncNow(true);toast(SYNC.err?'Saved on this device. Sync failed: '+SYNC.err:'Saved and synced')}else toast(ok?'All changes saved':'Not saved. Try again.')}
function setAuto(v){data.settings=data.settings||{};data.settings.autosave=v;saveData();toast(v?'Auto-save on':'Auto-save off. Tap Save to keep changes.')}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
async function saveData(){stampChanges();const ok=await sset(KEY,JSON.stringify(data));if(ok)dirty=false;updateSaveBtn();if(!ok)toast('Could not save on this device.');if(ok&&CLOUD)schedulePush();return ok}

/* ============ helpers ============ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const toD=s=>new Date(s+'T00:00');
function addMonths(s,n){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1+n,1);dt.setDate(Math.min(d,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()));return ymd(dt)}
const daysTo=s=>Math.round((toD(s)-toD(today()))/864e5);
const fmt=s=>s?toD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const opt=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel??'')?' selected':''}>${esc(l)}</option>`;
const opts=(list,sel,blank='–')=>(blank!==null?opt('',blank,sel):'')+list.map(o=>Array.isArray(o)?opt(o[0],o[1],sel):opt(o,o,sel)).join('');
function toast(m){const b=document.getElementById('toastbox');b.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML='',2600)}
function armed(btn,fn,label='Tap again to delete'){if(btn.dataset.armed){fn();return}const t=btn.textContent;btn.dataset.armed=1;btn.classList.add('armed');btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.classList.remove('armed');btn.textContent=t}},3000)}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function compressImage(src,maxDim,q){const img=await loadImg(src);const sc=Math.min(1,maxDim/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);let out=c.toDataURL('image/jpeg',q);while(out.length>4.4e6&&q>.35){q-=.1;out=c.toDataURL('image/jpeg',q)}return{data:out,w:c.width,h:c.height}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ============ model ============ */
const allMaps=()=>[...BUILTIN,...data.custom.filter(c=>!BUILTIN.some(b=>b.id===c.id))];
const getMap=id=>allMaps().find(m=>m.id===id);
function meta(id){return data.maps[id]||(data.maps[id]={pins:[],symbols:[]})}
const pinsOf=id=>meta(id).pins;
const buildingOf=m=>{const v=(data.mapBuilding||{})[m.id];return v!==undefined?v:(m.building||'')};
const bKey=m=>buildingOf(m)||m.name;
const curMap=()=>getMap(S.mapId);
const curPin=()=>pinsOf(S.mapId).find(p=>p.id===S.pinId);
function normPin(p){p.checks=p.checks||{};p.diagrams=p.diagrams||[];p.photos=p.photos||[];p.circuits=p.circuits||[];p.cables=p.cables||[];p.remedials=p.remedials||[];return p}
function placed(){const m={};for(const mp of allMaps())for(const p of pinsOf(mp.id))if(p.asset)m[p.asset]={map:mp,pin:p};return m}
const openRems=p=>(p.remedials||[]).filter(r=>r.status!=='Completed');
function worstCode(p){const order=['C1','C2','FI','C3'];const cs=openRems(p).map(r=>r.code).filter(Boolean);for(const c of order)if(cs.includes(c))return c;return ''}
function isBad(f,v){return !!v&&(v==='Not OK'||(f.o===YN&&v==='No')||v==='<1 (fail)'||v==='Fail'||(f.k==='AD'&&v!=='None'&&!v.startsWith('C3')))}
const isGood=(f,v)=>!!v&&!isBad(f,v)&&v!=='Not tested';
function rcdDue(p){const c=p.checks||{};if(!c.RCD6date||c.RCD6==='N/A – no RCD')return null;const next=addMonths(c.RCD6date,6);return{next,days:daysTo(next)}}
function pinStatus(p){
  const c=p.checks||{};const filled=FIELDS.filter(f=>c[f.k]);
  const bad=filled.some(f=>isBad(f,c[f.k]))||c.RCD6==='Fail'||['C1','C2','FI'].includes(worstCode(p));
  if(bad)return{k:'fault',c:'var(--red)',l:'Fault recorded'};
  if(c.AF)return{k:'done',c:'var(--ok)',l:'Signed off by '+c.AF};
  if(filled.length)return{k:'prog',c:'var(--amber)',l:`In progress, ${filled.length} of ${FIELDS.length} filled`};
  return{k:'todo',c:'var(--grey)',l:p.asset?'Not started':'No board linked yet'};
}
function circuitLabel(ci){return `${ci.no?('C'+ci.no):'Circuit'}${ci.desc?' '+ci.desc:''}`}
function remSummary(p){const rs=p.remedials||[];if(!rs.length)return (p.checks||{}).AEnotes||'';return rs.map(r=>[r.code,r.reg==='Other'?r.regOther:r.reg,r.obs,r.action,r.status==='Completed'?'(completed)':''].filter(Boolean).join(' – ')).join('; ')}

/* ============ state ============ */
const S={remSel:new Set(),sym:null,symCable:null,symSteps:[],symSel:null,lastSym:'light',lastTap:null,treeZ:1,view2:'',pinColour:'status',planWk:null,offEng:null,remF:'open',remQ:'',treeB:null,ai:null,adjust:null,editEng:null,view:'home',mapId:null,pinId:null,cableId:null,tab:'board',place:false,pendingAsset:'',locked:true,zoom:1,minZ:1,eng:'',search:'',editCircuit:null,draw:null,showCables:true,calEng:''};
const imgCache={};
const header=h=>{document.getElementById('hdr').innerHTML=h;updateSaveBtn()};

/* ============ home ============ */
function currentWeek(){const t=new Date();let best=null;for(const [wk,w] of Object.entries(WEEKS)){if(toD(w[2])<=t)best=+wk}return best||1}
function renderHome(){
  S.view='home';
  header(`<h1>DB Map</h1>${SB()}`);
  if(!allMaps().length&&!SCHED_DBS.length){document.getElementById('main').innerHTML=`<div class="wrap"><h2 style="margin-top:6px">Set up ${esc(siteName()||'your site')}</h2>
    <div class="card" style="font-size:15px">To start, connect to your team's backend, or import a site pack. You can also upload site maps and a DB schedule spreadsheet yourself.</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" onclick="openSite()">Site settings</button><label class="btn">Upload a map<input type="file" accept="image/*" hidden onchange="pickMap(this)"></label>${installEvt?'<button class="btn" onclick="installApp()">Install app</button>':''}</div></div>`;return}
  const pl=placed(),allPins=allMaps().flatMap(m=>pinsOf(m.id).map(p=>({m,p})));
  const cnt=k=>allPins.filter(x=>pinStatus(x.p).k===k).length;
  const rcd=allPins.map(x=>({...x,r:rcdDue(x.p)})).filter(x=>x.r&&x.r.days<=30).sort((a,b)=>a.r.days-b.r.days);
  const wk=currentWeek(),wkDbs=DBS.filter(d=>d.wk===wk&&(!S.eng||d.engineer===S.eng)),nOpen=allRems().filter(x=>x.r.status!=='Completed').length;
  let h=`<div class="wrap"><p class="sitebar">${esc(siteName())}${CLOUD?(SYNC.err?', offline, changes will sync later':', shared with the team'):', saved on this device'}</p>`;
  if(!hasStore)h+=`<div class="warn">Saving isn't available here, so changes will be lost when you close this page.</div>`;
  h+=`<div class="summary"><span>${plural(allPins.length,'board')} placed</span>
   <span><i class="dot" style="background:var(--ok)"></i>${cnt('done')} signed off</span>
   <span><i class="dot" style="background:var(--amber)"></i>${cnt('prog')} in progress</span>
   <span><i class="dot" style="background:var(--red)"></i>${cnt('fault')} with faults</span></div>
   <div class="row" style="margin-top:10px"><button class="btn primary" onclick="openReport()">Report</button><button class="btn" onclick="openPlan()">Schedule</button><button class="btn" onclick="openRemedials()">Remedials${nOpen?' ('+nOpen+')':''}</button><button class="btn" onclick="openTree()">Board tree</button><button class="btn" onclick="openTeam()">Engineers</button><button class="btn" onclick="openCalendar()">Reminders</button><button class="btn" onclick="openExport()">Export</button><button class="btn" onclick="openScanner()">Scan QR</button><button class="btn" onclick="openSite()">Site settings</button>${installEvt?'<button class="btn primary" onclick="installApp()">Install app</button>':''}</div>
   <label class="tog"><input type="checkbox" ${(data.settings||{}).autosave!==false?'checked':''} onchange="setAuto(this.checked)"> Auto-save changes</label>`;
  if(rcd.length)h+=`<h2>RCD 6-monthly tests due</h2>`+rcd.map(x=>`<button class="wkrow" style="border-left-color:${x.r.days<0?'var(--red)':'var(--amber)'}" onclick="openMap('${x.m.id}','${x.p.id}','checks')"><b>${esc(BY_ASSET[x.p.asset]?.ref||'Pin '+x.p.num)}</b><span>${esc(x.m.name)}</span><em>${x.r.days<0?'Overdue by '+plural(-x.r.days,'day'):x.r.days===0?'Due today':'Due in '+plural(x.r.days,'day')}</em></button>`).join('');
  h+='<h2>Site maps</h2><div class="maps">'+allMaps().map(m=>{const ps=pinsOf(m.id),f=ps.filter(p=>pinStatus(p).k==='fault').length;
    return `<button class="mapcard" onclick="openMap('${m.id}')"><img src="${m.thumb||m.src||''}" alt="" loading="lazy"><strong>${esc(m.name)}</strong><small>${ps.length?plural(ps.length,'board'):'No boards yet'}${f?', '+f+' with faults':''}</small></button>`}).join('')
    +`<label class="mapcard add">+ Upload a new map<input type="file" accept="image/*" hidden onchange="pickMap(this)"></label></div>`;
  const [wc,we]=WEEKS[wk]||['',''];
  if(!Object.keys(WEEKS).length){document.getElementById('main').innerHTML=h+'</div>';return}
  h+=`<h2>Week ${wk} boards, ${esc(wc)} to ${esc(we)}</h2>
   <select onchange="S.eng=this.value;renderHome()" aria-label="Filter by engineer">${opt('','All engineers',S.eng)}${engNames().map(e=>opt(e,e,S.eng)).join('')}</select><div style="margin-top:8px">`;
  h+=wkDbs.map(d=>{const at=pl[d.asset];const st=at?pinStatus(at.pin):null;
    return `<button class="wkrow" style="border-left-color:${st?st.c:'var(--line)'}" onclick="${at?`openMap('${at.map.id}','${at.pin.id}')`:`toast('Not on a map yet. Open its map and add a pin.')`}"><b>${esc(d.ref)}</b><span>${esc(d.building)}, ${esc(d.room)}<br>${esc(d.engineer||'Unassigned')}${d.changed?'<span class="chg">Changed</span>':''}</span><em>${st?esc(st.k==='todo'?'Placed':st.l.split(',')[0]):'Not placed'}</em></button>`}).join('')||'<p class="hint">No boards scheduled for this filter.</p>';
  h+='</div></div>';
  document.getElementById('main').innerHTML=h;
}
async function pickMap(inp){
  const f=inp.files[0];if(!f)return;toast('Preparing map…');
  try{const raw=await readFile(f),big=await compressImage(raw,2400,.88),th=await compressImage(raw,300,.7);
    const id='c'+uid();if(!await sset(KIMG+id,big.data)){toast('Map is too large to save. Try a smaller image.');return}

const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsFold(line){const out=[];let s=line;while(s.length>73){out.push(s.slice(0,73));s=' '+s.slice(73)}out.push(s);return out.join('\r\n')}
const dcompact=s=>s.replace(/-/g,'');
function calEvents(eng){
  const ev=[];
  for(const [wk,w] of Object.entries(WEEKS)){
    const list=DBS.filter(d=>d.wk===+wk&&(!eng||d.engineer===eng));if(!list.length)continue;
    const endEx=ymd(new Date(toD(w[2]).getTime()+5*864e5));
    ev.push({uid:'dbwk'+wk+(eng||'all').replace(/\W/g,''),title:`DB checks week ${wk}: ${plural(list.length,'board')}${eng?'':' (all engineers)'}`,start:w[2],endEx,
      desc:list.map(d=>`${d.ref} – ${d.building}, ${d.room}${eng?'':' ('+d.engineer+')'}`).join('\n')});
  }
  for(const m of allMaps())for(const p of pinsOf(m.id)){const r=rcdDue(p);if(!r)continue;const d=BY_ASSET[p.asset];if(eng&&d&&d.engineer!==eng)continue;
    const endEx=ymd(new Date(toD(r.next).getTime()+864e5));
    ev.push({uid:'rcd'+p.id+r.next,title:`RCD 6-monthly test: ${d?d.ref:'Pin '+p.num} (${m.name})`,start:r.next,endEx,desc:`Push-button test of RCDs at ${d?d.ref+', '+d.room:'pin '+p.num}. Last tested ${fmt(p.checks.RCD6date)}.`})}
  for(const m of allMaps())for(const p of pinsOf(m.id)){const nd=p.checks&&p.checks.nextDue;if(!nd)continue;const d=BY_ASSET[p.asset];if(eng&&d&&d.engineer!==eng)continue;
    const endEx=ymd(new Date(toD(nd).getTime()+864e5));
    ev.push({uid:'next'+p.id+nd,title:`DB check due: ${d?d.ref:'Pin '+p.num} (${m.name})`,start:nd,endEx,desc:`Routine check due at ${d?d.ref+', '+d.room:'pin '+p.num}. Last checked ${fmt(p.checks.date)}.`})}
  return ev.sort((a,b)=>a.start.localeCompare(b.start));
}
function buildIcs(ev,eng){const who=eng&&engByName(eng);
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DB Map//Skegness//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  for(const e of ev){L.push('BEGIN:VEVENT','UID:'+e.uid+'@dbmap','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dcompact(e.start),'DTEND;VALUE=DATE:'+dcompact(e.endEx),icsFold('SUMMARY:'+icsEsc(e.title)),icsFold('DESCRIPTION:'+icsEsc(e.desc)),...(e.attEmail?[icsFold('ATTENDEE;CN='+icsEsc(e.attName)+':mailto:'+e.attEmail)]:who&&who.email?[icsFold('ATTENDEE;CN='+icsEsc(who.name)+':mailto:'+who.email)]:[]),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title.slice(0,60)),'TRIGGER:-PT15H','END:VALARM','END:VEVENT')}
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function gcalLink(e,eng){const q=new URLSearchParams({action:'TEMPLATE',text:e.title,dates:dcompact(e.start)+'/'+dcompact(e.endEx),details:e.desc.slice(0,1500)});const em=eng&&engByName(eng)?.email;if(em)q.set('add',em);return 'https://calendar.google.com/calendar/render?'+q.toString()}

function updateBanner(){
  document.getElementById('placeBtn')?.classList.toggle('on',S.place);
  const b=document.getElementById('banner');if(!b)return;
  if(S.place)b.innerHTML=`<div class="banner"><span>Tap the map where ${S.pendingAsset?esc(BY_ASSET[S.pendingAsset].ref):'the board'} is. Zoom in first for accuracy.</span><button onclick="togglePlace()">Cancel</button></div>`;
  else if(S.sym){const lab=S.sym==='erase'?'':SYM[S.sym].l.toLowerCase();b.innerHTML=`<div class="banner"><span>${S.sym==='erase'?'Tap a symbol to remove it.':S.symCable?`Tap along the cable to add ${lab}s. Each tap adds one.`:`Tap the map to add a ${lab}. Tap on or near a cable to add it to that circuit.`}</span>${S.symSteps.length?'<button onclick="symUndo()">Undo</button>':''}<button class="go" onclick="endSyms()">Done</button></div>`}
  else if(S.adjust)b.innerHTML=`<div class="banner"><span>Drag the white dots to reshape the cable. Connected lines stay straight.</span><button class="go" onclick="endAdjust()">Done</button></div>`;
  else if(S.draw)b.innerHTML=`<div class="banner"><span>Tap along the cable route. Lines straighten automatically. Tap another DB to connect to it.</span><button onclick="drawUndo()" ${S.draw.pts.length?'':'disabled'}>Undo</button><button onclick="drawCancel()">Cancel</button><button class="go" onclick="drawFinish()" ${S.draw.pts.length?'':'disabled'}>Finish</button></div>`;
  else b.innerHTML='';
}

/* ---- cable drawing ---- */
function segDir(a,b){if(!a||!b)return null;if(Math.abs(a[1]-b[1])<1)return 'h';if(Math.abs(a[0]-b[0])<1)return 'v';return null}
function snapPts(prev,pt,dir){
  const dx=pt.x-prev[0],dy=pt.y-prev[1];if(Math.hypot(dx,dy)<2)return[];
  const a=Math.atan2(dy,dx)*180/Math.PI,n90=Math.round(a/90)*90,n45=Math.round(a/45)*45,T=8;
  if(Math.abs(a-n90)<=T)return Math.abs(n90)%180===0?[[pt.x,prev[1]]]:[[prev[0],pt.y]];
  if(n45%90!==0&&Math.abs(a-n45)<=T){const r=n45*Math.PI/180,t=dx*Math.cos(r)+dy*Math.sin(r);return[[prev[0]+t*Math.cos(r),prev[1]+t*Math.sin(r)]]}
  const hFirst=dir?dir==='h':Math.abs(dx)>=Math.abs(dy);
  return hFirst?[[pt.x,prev[1]],[pt.x,pt.y]]:[[prev[0],pt.y],[pt.x,pt.y]];
}
function tidy(start,pts,end){
  const all=[start,...pts,...(end?[end]:[])],out=[all[0]];
  for(let i=1;i<all.length;i++){const q=all[i],pr=out[out.length-1];if(Math.hypot(q[0]-pr[0],q[1]-pr[1])<1)continue;
    if(out.length>=2){const pp=out[out.length-2];if((Math.abs(pp[0]-pr[0])<1&&Math.abs(pr[0]-q[0])<1)||(Math.abs(pp[1]-pr[1])<1&&Math.abs(pr[1]-q[1])<1)){out[out.length-1]=q;continue}}
    out.push(q)}
  return out.slice(1,end?-1:undefined);
}
function startDraw(cableId){
  const p=curPin();S.draw={pinId:p.id,pts:[],steps:[],cableId:cableId||null};S.adjust=null;
  S.cableId=null;const el=document.getElementById('sheet');el.innerHTML='';S.place=false;
  updateBanner();drawAll();toast('Tap the map to route the cable');
}
function drawTap(pt){
  const p=pinsOf(S.mapId).find(x=>x.id===S.draw.pinId),all=[pinPx(p),...S.draw.pts],prev=all[all.length-1];
  const add=snapPts(prev,pt,segDir(all[all.length-2],prev));if(!add.length)return;
  S.draw.pts.push(...add);S.draw.steps.push(add.length);updateBanner();drawCables();
}
function drawToPin(targetId){
  if(targetId===S.draw.pinId){toast('That\'s the board this cable starts from');return}
  const p=pinsOf(S.mapId).find(x=>x.id===S.draw.pinId),t=pinsOf(S.mapId).find(x=>x.id===targetId);
  const prev=S.draw.pts.length?S.draw.pts[S.draw.pts.length-1]:pinPx(p),tp=pinPx(t);
  const all=[pinPx(p),...S.draw.pts],dir=segDir(all[all.length-2],prev);
  if(Math.abs(prev[0]-tp[0])>1&&Math.abs(prev[1]-tp[1])>1)S.draw.pts.push(dir==='v'?[prev[0],tp[1]]:[tp[0],prev[1]]);
  drawFinish(targetId);
}
function startAdjust(){S.adjust={pinId:S.pinId,cableId:S.cableId};const el=document.getElementById('sheet');el.innerHTML='';el.dataset.key='';updateBanner();drawAll();toast('Drag the white dots')}
function endAdjust(){const a=S.adjust;S.adjust=null;const p=pinsOf(S.mapId).find(x=>x.id===a.pinId),cb=p.cables.find(c=>c.id===a.cableId);const tp=cb.to&&pinsOf(S.mapId).find(x=>x.id===cb.to);cb.pts=tidy(pinPx(p),cb.pts,tp?pinPx(tp):null);scheduleSave();updateBanner();S.pinId=a.pinId;S.cableId=a.cableId;drawAll();renderSheet()}
function drawHandles(){
  const lab=document.getElementById('labels');if(!S.adjust||!lab)return;
  const m=curMap(),p=pinsOf(S.mapId).find(x=>x.id===S.adjust.pinId),cb=p.cables.find(c=>c.id===S.adjust.cableId);
  lab.innerHTML+=cb.pts.map((q,i)=>`<button class="vh" data-i="${i}" style="left:${q[0]/m.w*100}%;top:${q[1]/m.h*100}%" aria-label="Route point ${i+1}"></button>`).join('');
  lab.querySelectorAll('.vh').forEach(h=>{
    h.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();h.setPointerCapture(e.pointerId);h.classList.add('drag');h._on=true;
      const i=+h.dataset.i,all=cablePts(p,cb);h._dp=segDir(all[i],all[i+1]);h._dn=segDir(all[i+1],all[i+2])});
    h.addEventListener('pointermove',e=>{if(!h._on)return;const i=+h.dataset.i,pt=imgPt(e),all=cablePts(p,cb),prev=all[i],next=all[i+2];
      const cv=document.getElementById('cv'),thr=14*m.w/cv.getBoundingClientRect().width;let x=pt.x,y=pt.y;
      const prevFixed=i===0,nextFixed=i===cb.pts.length-1&&!!cb.to;
      if(h._dp==='h'){if(prevFixed)y=prev[1];else cb.pts[i-1][1]=y}else if(h._dp==='v'){if(prevFixed)x=prev[0];else cb.pts[i-1][0]=x}
      else if(prev){if(Math.abs(x-prev[0])<thr)x=prev[0];if(Math.abs(y-prev[1])<thr)y=prev[1]}
      if(next){if(h._dn==='h'){if(nextFixed)y=next[1];else cb.pts[i+1][1]=y}else if(h._dn==='v'){if(nextFixed)x=next[0];else cb.pts[i+1][0]=x}
      else{if(Math.abs(x-next[0])<thr)x=next[0];if(Math.abs(y-next[1])<thr)y=next[1]}}
      cb.pts[i]=[x,y];lab.querySelectorAll('.vh').forEach(v=>{const q=cb.pts[+v.dataset.i];v.style.left=q[0]/m.w*100+'%';v.style.top=q[1]/m.h*100+'%'});drawCablesOnly()});
    h.addEventListener('pointerup',e=>{h._on=false;h.classList.remove('drag');scheduleSave()});
    h.addEventListener('click',e=>e.stopPropagation());
  });
}
function drawUndo(){const n=S.draw.steps.pop()||1;S.draw.pts.splice(-n,n);updateBanner();drawCables()}
function drawCancel(){const pid=S.draw.pinId;S.draw=null;updateBanner();drawAll();openPin(pid,'circuits')}
function drawFinish(to){
  const d=S.draw,p=pinsOf(S.mapId).find(x=>x.id===d.pinId);normPin(p);
  if(!d.pts.length&&!to){toast('Tap at least one point first');return}
  const tp=to&&pinsOf(S.mapId).find(x=>x.id===to);d.pts=tidy(pinPx(p),d.pts,tp?pinPx(tp):null);
  let cb=d.cableId&&p.cables.find(c=>c.id===d.cableId);
  if(cb){cb.pts=d.pts;cb.to=to||null}
  else{cb={id:uid(),pts:d.pts,to:to||null,type:to?'submain':'',circuit:'',cable:'',size:'',powers:to?'Sub-DB':'',notes:''};p.cables.push(cb)}
  S.draw=null;updateBanner();scheduleSave();S.pinId=p.id;S.cableId=cb.id;drawAll();renderSheet();
  if(to){const t=pinsOf(S.mapId).find(x=>x.id===to);let msg='Connected to pin '+t.num;
    if(p.asset&&t.asset&&!parentOf(t.asset)&&t.asset!==p.asset&&!isDesc(t.asset,p.asset)){data.parents[t.asset]=p.asset;msg=BY_ASSET[t.asset].ref+' is now fed from '+BY_ASSET[p.asset].ref;scheduleSave()}
    toast(msg)}
}

/* ============ pin sheet ============ */
function openPin(id,tab){S.pinId=id;S.cableId=null;S.symSel=null;if(tab)S.tab=tab;S.search='';S.editCircuit=null;renderSheet();drawAll()}
function openCable(pinId,cabId){S.pinId=pinId;S.cableId=cabId;S.symSel=null;renderSheet();drawAll();const p=curPin(),cb=p&&p.cables.find(c=>c.id===cabId);if(cb){const pts=cablePts(p,cb),q=pts[Math.floor(pts.length/2)];centerPx(q[0],q[1])}}
function centerPx(x,y){const vp=document.getElementById('vp'),cv=document.getElementById('cv'),m=curMap();if(!cv)return;vp.scrollLeft=cv.offsetLeft+x/m.w*cv.offsetWidth-vp.clientWidth/2;vp.scrollTop=cv.offsetTop+y/m.h*cv.offsetHeight-vp.clientHeight*.22}
function closeSheet(){S.pinId=null;S.cableId=null;S.symSel=null;renderSheet();drawAll()}
function sheetHead(){
  const p=curPin(),st=pinStatus(p),d=BY_ASSET[p.asset];
  return `<div class="bign" style="background:${st.c}">${esc(p.num)}</div><div class="st"><b>${d?esc(d.ref)+' – '+esc(d.room):'No board linked'}</b>${esc(st.l)}</div><button class="close" onclick="closeSheet()">Close</button>`;
}
const refreshHead=()=>{const h=document.getElementById('shead');h&&(h.innerHTML=sheetHead())};
function sheetKeep(el,key){const had=!!el.querySelector('.sheet'),sb=el.querySelector('.sbody'),top=(had&&el.dataset.key===key&&sb)?sb.scrollTop:0;el.dataset.key=key;return{still:had?' still':'',restore:()=>{const n=el.querySelector('.sbody');if(n)n.scrollTop=top}}}
function renderSheet(){
  const el=document.getElementById('sheet');if(!el)return;if(S.symSel){renderSymSheet(el);return}const p=curPin();if(!p){el.innerHTML='';el.dataset.key='';return}normPin(p);
  if(S.cableId){renderCableSheet(el,p);return}
  const nd=p.diagrams.length,k=sheetKeep(el,'p'+p.id+S.tab);
  el.innerHTML=`<div class="sheet${k.still}" role="dialog" aria-label="Pin ${esc(p.num)}"><div class="shead" id="shead">${sheetHead()}</div>
   <div class="tabs" role="tablist">${[['board','Board'],['circuits','Circuits'+(p.circuits.length?' ('+p.circuits.length+')':'')],['checks','Checks'],['diagrams','Files'+(nd?' ('+nd+')':'')]].map(([k,l])=>`<button role="tab" class="${S.tab===k?'on':''}" onclick="S.tab='${k}';S.editCircuit=null;renderSheet()">${l}</button>`).join('')}</div>
   <div class="sbody" id="sbody"></div></div>`;
  ({board:renderBoard,circuits:renderCircuits,checks:renderChecks,diagrams:renderDiagrams})[S.tab]();
  k.restore();
}
const dbLabel=d=>`${d.ref} – ${d.room||d.floor}`;

  const d=BY_ASSET[p.asset],w=d&&WEEKS[d.wk];
  document.getElementById('sbody').innerHTML=`
   <div class="photos">${p.photos.map(ph=>`<button class="ph" onclick="viewFile('${ph.id}','photos')" aria-label="View photo"><img src="${ph.thumb}" alt=""></button>`).join('')}<label>${p.photos.length?'+ Add photo':'+ Add a photo of the board'}<input type="file" accept="image/*" multiple hidden onchange="addFiles(this,'photos')"></label></div>
   <div class="grid2"><div><label class="f" for="b-num">Pin number</label><input type="number" id="b-num" inputmode="numeric" value="${esc(p.num)}" oninput="setPin('num',this.value)"></div>

   <label class="f" for="b-db">Distribution board</label>
   ${list.length?`<select id="b-db" onchange="linkDb(this.value)"><option value="">Select a board…</option>${floors.map(f=>`<optgroup label="${esc(f||'Other')}">${optsFor(f)}</optgroup>`).join('')}${d&&!list.includes(d)?`<optgroup label="Other building">${opt(d.asset,dbLabel(d)+' ('+d.building+')',p.asset)}</optgroup>`:''}</select>`
     :`<p class="hint" style="margin-top:0">No boards listed for ${esc(bk)} yet. Search below or add a new one.</p>`}
   <label class="f" for="b-search">Search all boards</label><input type="search" id="b-search" placeholder="Asset code, DB name, building or room" value="${esc(S.search)}" oninput="S.search=this.value;searchDb()"><div id="results"></div>
   <div id="newdb"><button class="btn small" style="margin-top:10px" onclick="showNewDb()">+ Board not in the schedule</button></div>
   ${d?`<div class="card" id="dbcard"><b>${esc(d.ref)}</b>${d.edited?' <span class="chg">Renamed</span>':''}${d.custom?' (added by you)':''}<br>${d.custom?'':esc(d.asset)+'<br>'}${esc(d.name)}<br>${esc(d.building)}, ${esc(d.floor)}, ${esc(d.room)}${d.wk?'<br>Week '+d.wk+(w?' ('+esc(w[0])+' to '+esc(w[1])+')':''):''}
   <label class="f" for="b-eng" style="margin-top:8px">Assigned engineer</label><select id="b-eng" onchange="setAssign('${esc(d.asset)}',this.value)">${engOpts(d.engineer,'Unassigned')}</select>
   <div class="row" style="margin-top:10px"><button class="btn small" onclick="showEditDb()">Edit details</button><button class="btn small" onclick="showQR('${esc(d.asset)}')">QR label</button></div></div>`:''}
   ${p.asset?supplySection(p,list):''}
   <label class="f" for="b-notes">Notes</label><textarea id="b-notes" placeholder="Access, keys, location details" oninput="setPin('notes',this.value)">${esc(p.notes)}</textarea>
   <div class="row" style="margin-top:14px">${p.asset?'<button class="btn small" onclick="linkDb(\'\')">Unlink board</button>':''}<button class="btn small danger" onclick="armed(this,removePin,'Tap again to remove')">Remove pin</button></div>

  if(S.search)searchDb();

function supplySection(p,list){
  const a=p.asset,par=parentOf(a),kids=childrenOf(a),pd=BY_ASSET[par];
  const ok=d=>d.asset!==a&&!isDesc(a,d.asset);
  let o=opt('','Not recorded',par)+opt('SUPPLY','Incoming supply / main intake',par)+list.filter(ok).map(d=>opt(d.asset,dbLabel(d),par)).join('');
  if(pd&&!list.includes(pd))o+=opt(pd.asset,dbLabel(pd)+' ('+pd.building+')',par);
  return `<h3>Supply</h3><label class="f" for="b-par">Fed from</label><select id="b-par" onchange="setParent(this.value)">${o}</select>
   <input type="search" style="margin-top:6px" placeholder="Fed from a board in another building? Search" value="${esc(S.psearch||'')}" oninput="S.psearch=this.value;parentSearch()"><div id="presults"></div>
   <div style="margin-top:8px;font-size:14px"><b>Feeds:</b> ${kids.length?kids.map(k=>{const d=BY_ASSET[k];return d?`<button class="btn small" style="margin:3px 4px 0 0" onclick="goToAsset('${esc(k)}')">${esc(d.ref)}</button>`:''}).join(''):'<span class="muted">nothing recorded yet</span>'}</div>
   <button class="btn small" style="margin-top:8px" onclick="openTree(bKey(curMap()))">View board tree</button>`;
}
function parentSearch(){const q=(S.psearch||'').trim().toLowerCase(),el=document.getElementById('presults');if(!el)return;if(q.length<2){el.innerHTML='';return}
  const a=curPin().asset;el.innerHTML=DBS.filter(d=>d.asset!==a&&!isDesc(a,d.asset)&&(d.name+' '+d.building+' '+d.room+' '+d.asset).toLowerCase().includes(q)).slice(0,15).map(d=>`<button class="res" onclick="setParent('${esc(d.asset)}')"><b>${esc(d.ref)}</b> ${esc(d.building)}, ${esc(d.room)}</button>`).join('')||'<p class="hint">No boards match that.</p>'}
function setParent(v){const a=curPin().asset;if(v&&v!=='SUPPLY'&&(v===a||isDesc(a,v))){toast('That would make a loop');return}if(v)data.parents[a]=v;else delete data.parents[a];S.psearch='';scheduleSave();renderSheet();toast(v?'Supply updated':'Supply cleared')}
function goToAsset(asset){const at=placed()[asset];if(at){closeOv();openMap(at.map.id,at.pin.id)}else toast((BY_ASSET[asset]?.ref||'That board')+' isn\'t on a map yet')}

async function removePin(){
  const p=curPin();for(const g of [...p.diagrams,...p.photos])await sdel(KFILE+g.id);
  const m=meta(S.mapId);m.pins=m.pins.filter(x=>x.id!==p.id);
  m.pins.forEach(x=>(x.cables||[]).forEach(c=>{if(c.to===p.id)c.to=null}));
  S.pinId=null;renderSheet();drawAll();scheduleSave();toast('Pin '+p.num+' removed');
}

  let h=`<h3>Cables on the map</h3>`;
  h+=p.cables.map(cb=>{const ci=p.circuits.find(c=>c.id===cb.circuit),t=CT[cb.type]||CT.other,to=cb.to&&pinsOf(S.mapId).find(x=>x.id===cb.to);
    return `<button class="item" onclick="openCable('${p.id}','${cb.id}')"><i class="sw" style="background:${cb.type==='bonding'?`repeating-linear-gradient(180deg,${t.c} 0 6px,#F2C400 6px 12px)`:t.c}"></i><span><b>${esc(ci?circuitLabel(ci):(cb.powers||'Cable'))}</b><br>${esc([cb.cable,cb.size?cb.size+' mm²':''].filter(Boolean).join(', ')||'Details not set')}${to?', to pin '+esc(to.num):''}${symCounts(cb.id)?'<br>'+esc(symCounts(cb.id)):''}</span><em>${esc(t.l)}</em></button>`}).join('')||'<p class="hint" style="margin-top:2px">No cables drawn yet.</p>';

function circuitForm(ci){
  return `<div class="edit" id="ciform"><h3>${ci.id==='new'?'New circuit':'Edit circuit'}</h3>

   <label class="f" for="ci-desc">What it powers</label><input type="text" id="ci-desc" list="powers" value="${esc(ci.desc||'')}" placeholder="e.g. Kitchen sockets">
   <div class="grid3"><div><label class="f" for="ci-dev">Device</label><select id="ci-dev">${opts(DEVICES,ci.device,null)}</select></div><div><label class="f" for="ci-curve">Curve</label><select id="ci-curve">${opts(CURVES,ci.curve,null)}</select></div><div><label class="f" for="ci-rat">Rating (A)</label><select id="ci-rat">${opts(RATINGS,ci.rating)}</select></div></div>
   <label class="f" for="ci-rcd">RCD protection</label><select id="ci-rcd">${opts(RCDS,ci.rcd,null)}</select>
   <div class="grid2"><div><label class="f" for="ci-cab">Cable type</label><select id="ci-cab">${opts(CABLES,ci.cable)}</select></div><div><label class="f" for="ci-size">Size (mm²)</label><select id="ci-size">${opts(SIZES,ci.size)}</select></div></div>
   <datalist id="powers">${POWERS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>

function saveCircuit(id){
  const p=curPin(),v=k=>document.getElementById(k).value;
  const vals={no:v('ci-no').trim(),type:v('ci-type'),desc:v('ci-desc').trim(),device:v('ci-dev'),curve:v('ci-curve'),rating:v('ci-rat'),rcd:v('ci-rcd'),cable:v('ci-cab'),size:v('ci-size')};
  if(id==='new')p.circuits.push({id:uid(),...vals});else Object.assign(p.circuits.find(c=>c.id===id),vals);
  if(id!=='new')p.cables.filter(cb=>cb.circuit===id).forEach(cb=>Object.assign(cb,{type:vals.type,cable:vals.cable||cb.cable,size:vals.size||cb.size,powers:vals.desc||cb.powers}));
  S.editCircuit=null;scheduleSave();renderSheet();drawAll();toast(id==='new'?'Circuit added':'Circuit saved');
}
function deleteCircuit(id){const p=curPin();p.circuits=p.circuits.filter(c=>c.id!==id);p.cables.forEach(cb=>{if(cb.circuit===id)cb.circuit=''});S.editCircuit=null;scheduleSave();renderSheet();drawAll()}

const AI_PROMPT=`You are reading a UK electrical distribution board photo, circuit chart, or an EICR schedule of circuits. List every circuit you can read.
Reply with ONLY a JSON array and no other text. One row per circuit, in this order:
["circuit no","what it powers","type","device","curve","rating A","rcd","cable","size mm2"]
type: lighting, power, bonding, submain, emergency or other.
device: MCB, RCBO, MCCB, BS 88 fuse, BS 1361 fuse, BS 3036 rewireable, Isolator / switch or Spare.
curve: B, C, D or –.
rcd: 30 mA RCBO, Via 30 mA RCD, Via 100 mA RCD, Via 300 mA RCD or None.
cable: e.g. 6242Y twin & earth, SWA 3-core, LSZH singles (6491B), FP200 / fire resistant, or "".
Use "" for anything you cannot read. Never guess values that are not visible. Keep descriptions short.`;
function aiBlock(){
  const a=S.ai;
  if(!a||a.pin!==S.pinId)return `<label class="btn wide" style="margin:6px 0 4px">Read circuits from a photo or EICR<input type="file" accept="image/*,application/pdf" hidden onchange="aiRead(this)"></label><p class="hint" style="margin:0 0 6px">Take a photo of the circuit chart or board, or upload an old EICR. You check the results before anything is added.</p>`;
  if(a.loading)return `<div class="card">Reading ${esc(a.name)}… this takes around 20 seconds.</div>`;
  if(a.error)return `<div class="warn" style="margin-top:8px">${esc(a.error)}</div><button class="btn small" onclick="S.ai=null;renderCircuits()">OK</button>`;
  return `<div class="edit"><h3>Found ${plural(a.rows.length,'circuit')}</h3><p class="hint" style="margin-top:0">Untick anything that's wrong. Matching circuit numbers are updated, new ones are added.</p>
   ${a.rows.map((r,i)=>`<label class="airow"><input type="checkbox" ${r.on?'checked':''} onchange="S.ai.rows[${i}].on=this.checked"><span><b>${esc(r.no?'C'+r.no:'–')} ${esc(r.desc||'No description')}</b><br>${esc([r.curve&&r.curve!=='–'?r.curve+(r.rating||''):r.rating?r.rating+' A':'',r.device,r.rcd&&r.rcd!=='None'?r.rcd:'',r.cable,r.size?r.size+' mm²':'',(CT[r.type]||CT.other).l].filter(Boolean).join(', '))}</span></label>`).join('')}
   <div class="row" style="margin-top:10px"><button class="btn primary" onclick="aiAdd()">Add ticked circuits</button><button class="btn" onclick="S.ai=null;renderCircuits()">Cancel</button></div>
   ${a.rows.length>=28?'<p class="hint">Big boards may run past what can be read in one go. If circuits are missing, photograph the rest separately.</p>':''}</div>`;
}
const pick=(list,v)=>{if(!v)return '';const s=String(v).toLowerCase().trim();return list.find(x=>x.toLowerCase()===s)||list.find(x=>x.toLowerCase().includes(s)||s.includes(x.toLowerCase()))||''};
function normRow(r){const [no,desc,type,device,curve,rating,rcd,cable,size]=r.map(x=>x==null?'':String(x).trim());
  const t=CTYPES.find(c=>c[0]===type.toLowerCase())?type.toLowerCase():(/light/i.test(type+desc)?'lighting':/bond|earth/i.test(type)?'bonding':/emerg/i.test(type)?'emergency':/sub|feed|db/i.test(type)?'submain':'power');
  const rt=(rating.match(/\d+/)||[''])[0],sz=(size.match(/\d+(\.\d+)?/)||[''])[0];
  return{on:true,no:no.replace(/^c(?=\d)/i,''),desc,type:t,device:pick(DEVICES,device)||(device?'':''),curve:['B','C','D'].includes(curve.toUpperCase())?curve.toUpperCase():'–',rating:RATINGS.includes(rt)?rt:'',rcd:pick(RCDS,rcd)||'None',cable:pick(CABLES,cable),size:SIZES.find(x=>parseFloat(x)===parseFloat(sz))||''}}
function parseRows(text){
  const t=text.replace(/\`\`\`json|\`\`\`/g,'').trim();
  try{const j=JSON.parse(t);const arr=Array.isArray(j)?j:(j.circuits||[]);return arr.filter(Array.isArray)}catch(e){}
  const rows=[];for(const m of t.matchAll(/\[\s*"[^\[\]]*\]/g)){try{const r=JSON.parse(m[0]);if(Array.isArray(r)&&r.length>=2)rows.push(r)}catch(e){}}return rows;
}
async function aiRead(inp){
  const f=inp.files[0];if(!f)return;const pid=S.pinId;S.ai={pin:pid,loading:true,name:f.name};renderCircuits();
  try{
    let block;
    if(f.type==='application/pdf'){const raw=await readFile(f);if(raw.length>9e6)throw new Error('That PDF is too big. Try just the schedule of circuits pages, or a photo of them.');block={type:'document',source:{type:'base64',media_type:'application/pdf',data:raw.split(',')[1]}}}
    else{const c=await compressImage(await readFile(f),1800,.85);block={type:'image',source:{type:'base64',media_type:'image/jpeg',data:c.data.split(',')[1]}}}
    let text;
    if(CLOUD){const j=await api('readCircuits',{media_type:block.type==='document'?'application/pdf':'image/jpeg',data:block.source.data,prompt:AI_PROMPT});text=j.text}
    else{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[block,{type:'text',text:AI_PROMPT}]}]})});
    if(!res.ok)throw new Error('Reading failed ('+res.status+'). Connect to your team backend in Site settings, or open the app inside Claude.');
    const j=await res.json();text=(j.content||[]).map(i=>i.type==='text'?i.text:'').join('\n')}
    const rows=parseRows(text).map(normRow).filter(r=>r.no||r.desc);
    S.ai=rows.length?{pin:pid,rows}:{pin:pid,error:'No circuits could be read. Try a sharper, straight-on photo of the circuit chart.'};
  }catch(e){S.ai={pin:pid,error:e.message&&!/fetch/i.test(e.message)?e.message:(CLOUD?'Couldn\'t reach the team backend. Check your connection.':'Couldn\'t reach the reader. Connect to your team backend in Site settings, or open the app inside Claude.')}}
  if(S.pinId===pid&&S.tab==='circuits'&&!S.cableId)renderCircuits();
}
function aiAdd(){
  const p=curPin(),rows=S.ai.rows.filter(r=>r.on);let add=0,upd=0;
  for(const r of rows){const {on,...v}=r;const ex=v.no&&p.circuits.find(c=>String(c.no)===String(v.no));
    if(ex){for(const k in v)if(v[k])ex[k]=v[k];upd++}else{p.circuits.push({id:uid(),...v});add++}}
  S.ai=null;scheduleSave();renderSheet();toast([add?plural(add,'circuit')+' added':'',upd?upd+' updated':''].filter(Boolean).join(', ')||'Nothing added');
}

  const d=BY_ASSET[p.asset],t=CT[cb.type]||CT.other,to=cb.to&&pinsOf(S.mapId).find(x=>x.id===cb.to),toDb=to&&BY_ASSET[to.asset],k=sheetKeep(el,'c'+cb.id);
  el.innerHTML=`<div class="sheet cable${k.still}" role="dialog" aria-label="Cable"><div class="shead"><div class="bign" style="background:${t.c}">⌇</div><div class="st"><b>Cable from ${esc(d?d.ref:'pin '+p.num)}</b>${to?'Connects to pin '+esc(to.num)+(toDb?' ('+esc(toDb.ref)+')':''):esc(t.l)}</div><button class="close" onclick="S.cableId=null;S.tab='circuits';renderSheet();drawAll()">‹ Board</button></div>
   <div class="sbody">
   <label class="f" for="cb-ci">Circuit in ${esc(d?d.ref:'this board')}</label><select id="cb-ci" onchange="cableCircuit(this.value)">${opt('','Not linked to a circuit',cb.circuit)}${p.circuits.map(ci=>opt(ci.id,circuitLabel(ci),cb.circuit)).join('')}</select>
   ${p.circuits.length?'':'<p class="hint">Add circuits on the Circuits tab to pick them here.</p>'}
   <label class="f" for="cb-type">Circuit type</label><select id="cb-type" onchange="setCab('type',this.value)">${opts(CTYPES.map(c=>[c[0],c[1]]),cb.type,'Select…')}</select>
   <div class="grid2"><div><label class="f" for="cb-cab">Cable type</label><select id="cb-cab" onchange="setCab('cable',this.value)">${opts(CABLES,cb.cable)}</select></div><div><label class="f" for="cb-size">Size (mm²)</label><select id="cb-size" onchange="setCab('size',this.value)">${opts(SIZES,cb.size)}</select></div></div>
   <label class="f" for="cb-pow">What it powers</label><input type="text" id="cb-pow" list="powers2" value="${esc(cb.powers||'')}" oninput="setCab('powers',this.value)"><datalist id="powers2">${POWERS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
   <div class="card">${symCounts(cb.id)?'On this cable: '+esc(symCounts(cb.id)):'No lights or points on this cable yet.'}<br><button class="btn small primary" style="margin-top:8px" onclick="startSyms('${defKind(cb.type)}',{pin:'${p.id}',cab:'${cb.id}'})">Add points to this cable</button></div>
   <label class="f" for="cb-notes">Notes</label><textarea id="cb-notes" placeholder="Route, containment, length" oninput="setCab('notes',this.value)">${esc(cb.notes||'')}</textarea>
   <div class="row" style="margin-top:14px"><button class="btn small" onclick="startAdjust()">Adjust route</button><button class="btn small" onclick="startDraw('${cb.id}')">Redraw route</button><button class="btn small danger" onclick="armed(this,deleteCable)">Delete cable</button></div>
   </div></div>`;
  k.restore();
}
function curCable(){return curPin().cables.find(c=>c.id===S.cableId)}
function setCab(k,v){const cb=curCable();cb[k]=v;scheduleSave();if(k==='type'||k==='size')drawCables();if(k==='type'){const b=document.querySelector('.sheet .bign'),t=CT[v]||CT.other;if(b)b.style.background=t.c}}
function cableCircuit(id){const p=curPin(),cb=curCable(),ci=p.circuits.find(c=>c.id===id);cb.circuit=id;if(ci){Object.assign(cb,{type:ci.type||cb.type,cable:ci.cable||cb.cable,size:ci.size||cb.size,powers:ci.desc||cb.powers});
  const set=(i,v)=>{const e=document.getElementById(i);if(e)e.value=v||''};set('cb-type',cb.type);set('cb-cab',cb.cable);set('cb-size',cb.size);set('cb-pow',cb.powers);
  const b=document.querySelector('.sheet .bign');if(b)b.style.background=(CT[cb.type]||CT.other).c;toast('Filled from '+circuitLabel(ci))}
  scheduleSave();drawCables()}
function deleteCable(){const p=curPin();p.cables=p.cables.filter(c=>c.id!==S.cableId);S.cableId=null;S.tab='circuits';scheduleSave();renderSheet();drawAll()}

/* ---- checks tab ---- */
function renderChecks(){
  const p=curPin(),c=p.checks,r=rcdDue(p),d=BY_ASSET[p.asset];
  let h=`<div class="grid2"><div><label class="f" for="c-date">Check date</label><input type="date" id="c-date" value="${esc(c.date||'')}" onchange="setC('date',this.value)"></div>
   <div style="display:flex;align-items:flex-end"><button class="btn small wide" style="margin-bottom:2px" onclick="setAllOk()">Set blanks to OK</button></div></div>
   <button class="btn wide" style="margin-top:10px" onclick="exportBoardXlsx()">Download this check to Excel</button>
   <div class="remind"><label class="f" for="rm-freq" style="margin-top:0">Remind me to check again</label>
    <div class="grid2"><select id="rm-freq" onchange="setReminder(this.value)">${opts([['','Don\'t remind'],['1','Every month'],['3','Every 3 months'],['6','Every 6 months'],['12','Every 12 months']],c.remindFreq||'',null)}</select>
    <input type="date" id="rm-date" value="${esc(c.nextDue||'')}" onchange="setNextDue(this.value)" aria-label="Next due date"></div>
    ${c.nextDue?`<p class="hint" style="margin:8px 0 0">Next due ${fmt(c.nextDue)}${daysTo(c.nextDue)<0?', overdue':daysTo(c.nextDue)<=30?', due soon':''}.</p>
    <div class="row" style="margin-top:8px"><button class="btn small" onclick="downloadNextDue()">Download reminder</button><a class="btn small" href="${esc(gcalLink({title:'DB check due: '+(d?d.ref:'Pin '+p.num),start:c.nextDue,endEx:ymd(new Date(toD(c.nextDue).getTime()+864e5)),desc:'Routine check due at '+(d?d.ref+', '+d.room:'pin '+p.num)+'.'},d&&d.engineer))}" target="_blank" rel="noopener">Add to Google Calendar</a></div>`
    :`<p class="hint" style="margin:8px 0 0">Pick a frequency to set the next due date automatically, or set a date directly.</p>`}</div>`;
  for(const f of FIELDS){
    if(f.g)h+=`<h3>${f.g}</h3>`;
    if(f.k==='AF'){h+=remedialSection(p)}
    let v=c[f.k]||'';const auto=f.k==='AD'&&p.remedials.length;
    if(auto)v=CODES.find(x=>x[0]===worstCode(p))?.[1]||'None';
    const cls=isBad(f,v)?'bad':isGood(f,v)?'good':'';
    h+=`<div class="fld"><span>${esc(f.l)}${auto?'<br><small class="muted">Set from remedials</small>':''}</span>${f.t==='text'
      ?`<input type="text" inputmode="decimal" placeholder="${esc(f.ph)}" value="${esc(v)}" oninput="setC('${f.k}',this.value)" aria-label="${esc(f.l)}">`
      :`<select class="${cls}" ${auto?'disabled':''} onchange="setC('${f.k}',this.value,this)" aria-label="${esc(f.l)}">${f.eng?engOpts(v,'–'):opt('','–',v)+f.o.map(o=>opt(o,o,v)).join('')}</select>`}</div>`;
    if(f.k==='W'){
      const rv=c.RCD6||'',rc=rv==='Fail'?'bad':rv==='Pass'?'good':'';
      h+=`<div class="fld"><span>RCD 6-monthly test (test button)</span><select class="${rc}" onchange="setC('RCD6',this.value,this,true)" aria-label="RCD 6-monthly test">${opts(RCD6,rv)}</select></div>
      <div class="fld"><span>RCD test date${r?`<br><small style="color:${r.days<0?'var(--red)':r.days<=30?'var(--amber)':'var(--muted)'}">Next due ${fmt(r.next)}${r.days<0?', overdue':''}</small>`:''}</span><input type="date" value="${esc(c.RCD6date||'')}" onchange="setC('RCD6date',this.value);renderChecks()" aria-label="RCD test date"></div>`;
    }
  }
  h+=`<p class="hint">Picking an engineer in sign-off marks the board complete. Any Not OK, No, IR fail, RCD fail or open C1, C2 or FI remedial turns the pin red.</p>`;
  document.getElementById('sbody').innerHTML=h;
}
function remedialSection(p){
  let h=`<div style="margin:6px 0 4px"><b style="font-size:15px">Remedial actions</b></div>`;
  h+=p.remedials.map((r,i)=>{const col=r.status==='Completed'?'var(--ok)':r.code==='C3'?'var(--amber)':r.code?'var(--red)':'var(--grey)';
    return `<div class="rem" style="border-left-color:${col}">
     <div class="grid2"><div><label class="f">Code</label><select onchange="setRem('${r.id}','code',this.value)">${opts(CODES,r.code,'Select…')}</select></div><div><label class="f">Status</label><select onchange="setRem('${r.id}','status',this.value)">${opts(REM_STATUS,r.status||'Open',null)}</select></div></div>
     <label class="f">Regulation breached</label><select onchange="setRem('${r.id}','reg',this.value)">${opt('','Select…',r.reg)}${REGS.map(g=>opt(g[0],g[0]+' – '+g[1],r.reg)).join('')}${opt('Other','Other (type below)',r.reg)}</select>
     ${r.reg==='Other'?`<input type="text" style="margin-top:6px" placeholder="Regulation number" value="${esc(r.regOther||'')}" oninput="setRem('${r.id}','regOther',this.value,true)">`:''}
     <label class="f">Observation</label><textarea placeholder="What you found and where" oninput="setRem('${r.id}','obs',this.value,true)">${esc(r.obs||'')}</textarea>
     <label class="f">Action</label><select onchange="setRem('${r.id}','action',this.value)">${opts(ACTIONS,r.action,'Select…')}</select>
     <div class="row" style="margin-top:8px"><button class="btn small danger" onclick="armed(this,()=>delRem('${r.id}'),'Tap again to remove')">Remove remedial ${i+1}</button></div></div>`}).join('');
  h+=`<button class="btn wide" style="margin:10px 0 6px" onclick="addRem()">+ Add remedial</button>`;
  if(p.remedials.length)h+=`<p class="hint" style="margin:0 0 6px">Every remedial also appears in Remedials on the home screen, where you can quote, test and complete it. Regulation numbers follow BS 7671:2018. Check them against Amendment 4 before issuing a report.</p>`;
  return h;
}
function addRem(){const p=curPin();p.remedials.push({id:uid(),code:'',reg:'',regOther:'',obs:'',action:'',status:'Open',raised:today()});if(!p.checks.date)p.checks.date=today();scheduleSave();renderChecks()}
function setRem(id,k,v,quiet){const r=curPin().remedials.find(x=>x.id===id);r[k]=v;scheduleSave();if(!quiet){renderChecks();refreshHead();drawPins()}}
function delRem(id){const p=curPin();p.remedials=p.remedials.filter(x=>x.id!==id);scheduleSave();renderChecks();refreshHead();drawPins()}
function setC(k,v,el,rcd){
  const p=curPin(),c=p.checks;c[k]=v;
  if(k!=='date'&&k!=='RCD6date'&&v&&!c.date){c.date=today();const d=document.getElementById('c-date');if(d)d.value=c.date}
  if(k==='RCD6'&&v&&v!=='N/A – no RCD'&&!c.RCD6date){c.RCD6date=today();scheduleSave();renderChecks();refreshHead();drawPins();return}
  if(el){if(rcd)el.className=v==='Fail'?'bad':v==='Pass'?'good':'';else{const f=FIELDS.find(x=>x.k===k);el.className=isBad(f,v)?'bad':isGood(f,v)?'good':''}}
  refreshHead();drawPins();scheduleSave();
}
function setReminder(freq){const p=curPin(),c=p.checks;c.remindFreq=freq;if(freq)c.nextDue=addMonths(c.date||today(),+freq);else delete c.nextDue;scheduleSave();renderChecks()}
function setNextDue(v){const p=curPin(),c=p.checks;if(v)c.nextDue=v;else delete c.nextDue;scheduleSave();renderChecks()}
function downloadNextDue(){
  const p=curPin(),c=p.checks,d=BY_ASSET[p.asset];if(!c.nextDue)return;
  const e={uid:'next'+p.id+c.nextDue,title:'DB check due: '+(d?d.ref:'Pin '+p.num),start:c.nextDue,endEx:ymd(new Date(toD(c.nextDue).getTime()+864e5)),desc:'Routine check due at '+(d?d.ref+', '+d.room:'pin '+p.num)+'.',attName:d&&d.engineer,attEmail:d&&engByName(d.engineer)?.email};
  download('db-check-reminder.ics',buildIcs([e]),'text/calendar');toast('Reminder downloaded');
}
async function exportBoardXlsx(){
  const p=curPin(),c=p.checks,m=curMap(),d=BY_ASSET[p.asset]||{};toast('Building spreadsheet…');
  try{
    await loadScript(XLSX_CDN);
    const r=rcdDue(p),vals={...c,AD:p.remedials.length?(CODES.find(x=>x[0]===worstCode(p))?.[1]||'None'):c.AD,AE:remSummary(p)};
    const checkRows=[['Field','Value'],['Map',m.name],['Pin',p.num],['DB ref',d.ref||''],['Asset code',d.custom?'':(d.asset||'')],['Building',d.building||buildingOf(m)],['Floor',d.floor||''],['Room',d.room||''],['Engineer',d.engineer||''],
      ['Check date',c.date||''],...FIELDS.map(f=>[f.l,vals[f.k]||'']),['RCD 6-monthly test',c.RCD6||''],['RCD test date',c.RCD6date||''],['RCD next due',r?r.next:''],['Next check due',c.nextDue||''],['Notes',p.notes||'']];
    const circRows=[['Circuit','Description','Type','Device','Curve','Rating (A)','RCD','Cable','Size (mm²)'],...p.circuits.map(ci=>[ci.no,ci.desc,(CT[ci.type]||{}).l||ci.type,ci.device,ci.curve,ci.rating,ci.rcd,ci.cable,ci.size])];
    const remRows2=[['Code','Regulation','Observation','Action','Status','Raised','Quote (£)','Test result','Completed date','Completed by','Job notes'],...p.remedials.map(rr=>[rr.code,rr.reg==='Other'?rr.regOther:rr.reg,rr.obs,rr.action,rr.status||'Open',rr.raised||'',rr.quote||'',rr.testResult||'',rr.completedDate||'',rr.completedBy||'',rr.jobNotes||''])];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(checkRows),'Check');
