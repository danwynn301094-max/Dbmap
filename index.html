/* ---- shared sync logic: identical code runs in the app and in Apps Script ----
   Every record (pin, symbol, custom map, added board, engineer, key/value setting)
   carries a timestamp "u". When two copies meet, the newest version of each record
   wins, and deletions are remembered as tombstones so they don't come back. */
var KV_SECTIONS=['engOverride','weekOverride','parents','dbEdits','mapBuilding','site'];
function dmFlatten(d){
  var R={},mid,k;d=d||{};var maps=d.maps||{};
  for(mid in maps){var m=maps[mid]||{};
    (m.pins||[]).forEach(function(p){R['p:'+mid+':'+p.id]=p});
    (m.symbols||[]).forEach(function(s){R['s:'+mid+':'+s.id]=s})}
  (d.custom||[]).forEach(function(c){R['cm:'+c.id]=c});
  (d.customDbs||[]).forEach(function(c){R['cd:'+c.asset]=c});
  (d.engineers||[]).forEach(function(e){R['e:'+e.id]=e});
  var kvu=d.kvu||{};
  KV_SECTIONS.forEach(function(sec){var o=d[sec]||{};for(k in o)R['kv:'+sec+':'+k]={v:o[k],u:kvu[sec+':'+k]||0}});
  return R;
}
function dmUnflatten(R,T){
  var d={maps:{},custom:[],customDbs:[],engineers:[],kvu:{},tomb:T||{}};
  KV_SECTIONS.forEach(function(s){d[s]={}});
  Object.keys(R).forEach(function(key){
    var r=R[key],i=key.indexOf(':'),type=key.slice(0,i),rest=key.slice(i+1);
    if(type==='p'||type==='s'){var j=rest.indexOf(':'),mid=rest.slice(0,j);
      var m=d.maps[mid]||(d.maps[mid]={pins:[],symbols:[]});(type==='p'?m.pins:m.symbols).push(r)}
    else if(type==='cm')d.custom.push(r);
    else if(type==='cd')d.customDbs.push(r);
    else if(type==='e')d.engineers.push(r);
    else if(type==='kv'){var j2=rest.indexOf(':'),sec=rest.slice(0,j2),k=rest.slice(j2+1);
      if(KV_SECTIONS.indexOf(sec)>=0){d[sec][k]=r.v;d.kvu[sec+':'+k]=r.u||0}}
  });
  d.custom.sort(function(a,b){return a.id<b.id?-1:a.id>b.id?1:0});
  d.engineers.sort(function(a,b){return ((a.o==null?1e9:a.o)-(b.o==null?1e9:b.o))||(a.id<b.id?-1:1)});
  return d;
}
function dmMerge(a,b){
  var A=dmFlatten(a),B=dmFlatten(b),T={},k;
  [a&&a.tomb,b&&b.tomb].forEach(function(t){for(k in (t||{}))T[k]=Math.max(T[k]||0,t[k])});
  var out={},keys={};for(k in A)keys[k]=1;for(k in B)keys[k]=1;
  for(k in keys){var x=A[k],y=B[k],r=!x?y:!y?x:((y.u||0)>=(x.u||0)?y:x);
    if(T[k]&&T[k]>=(r.u||0))continue;out[k]=r}
  var cut=Date.now()-180*864e5;for(k in T)if(T[k]<cut)delete T[k];
  return dmUnflatten(out,T);
}

function symCounts(cabId){const c={};symsOf(S.mapId).filter(s=>s.cab===cabId).forEach(s=>c[s.k]=(c[s.k]||0)+1);return Object.entries(c).map(([k,n])=>plural(n,SYM[k].l.toLowerCase())).join(', ')}
function startSyms(k,cable){Object.assign(S,{place:false,draw:null,adjust:null,sym:k||S.lastSym||'light',symCable:cable||null,symSteps:[],pinId:null,cableId:null,symSel:null});renderSheet();drawPalette();updateBanner();drawAll()}
function endSyms(){const back=S.symCable;S.sym=null;S.symCable=null;drawPalette();updateBanner();drawAll();if(back){S.pinId=back.pin;S.cableId=back.cab;renderSheet()}}
function pickSym(k){S.sym=k;if(k!=='erase')S.lastSym=k;drawPalette();updateBanner()}
function symUndo(){const id=S.symSteps.pop();if(id)removeSym(id);updateBanner()}
function drawPalette(){const el=document.getElementById('palette');document.getElementById('drawBtn')?.classList.toggle('on',!!S.sym);if(!el)return;if(!S.sym){el.innerHTML='';return}
  el.innerHTML=`<div class="pal" role="toolbar" aria-label="Symbols">${SYMS.map(s=>`<button class="${S.sym===s.k?'on':''}" onclick="pickSym('${s.k}')" aria-pressed="${S.sym===s.k}">${symSvg(s.k,26)}<span>${esc(s.l)}</span></button>`).join('')}<button class="${S.sym==='erase'?'on':''}" onclick="pickSym('erase')" aria-pressed="${S.sym==='erase'}"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M5 20h14M7 15l7-9 5 4-7 9H9z" fill="none" stroke="#333" stroke-width="2"/></svg><span>Erase</span></button></div>`;
  document.getElementById('drawBtn')?.classList.toggle('on',!!S.sym);
}
function placeSym(pt){
  let x=pt.x,y=pt.y,link=null;
  if(S.symCable){const c=findCable(S.symCable.pin,S.symCable.cab);if(c){const n=nearestOnPolyline(c.pts,x,y);x=n.x;y=n.y;link=S.symCable}}
  else{const thr=screenToImg(22);let best=null;for(const c of allCables()){const n=nearestOnPolyline(c.pts,x,y);if(n.d<thr&&(!best||n.d<best.n.d))best={c,n}}
    if(best){x=best.n.x;y=best.n.y;link={pin:best.c.p.id,cab:best.c.cb.id}}}
  const s={id:uid(),k:S.sym,x,y,label:'',notes:''};if(link){s.pin=link.pin;s.cab=link.cab}
  symsOf(S.mapId).push(s);S.symSteps.push(s.id);scheduleSave();drawSyms();updateBanner();
}
function drawSyms(){
  const el=document.getElementById('syms');if(!el)return;const m=curMap(),list=symsOf(S.mapId);
  for(const s of list){if(s.cab){const c=findCable(s.pin,s.cab);if(!c){delete s.pin;delete s.cab}else{const n=nearestOnPolyline(c.pts,s.x,s.y);if(n.d>0.5){s.x=n.x;s.y=n.y}}}}
  el.innerHTML=(S.showSyms===false?[]:list).map(s=>`<button class="sym${S.symSel===s.id?' sel':''}" data-id="${s.id}" style="left:${s.x/m.w*100}%;top:${s.y/m.h*100}%" aria-label="${esc((SYM[s.k]||{}).l||'Symbol')}${s.label?' '+esc(s.label):''}">${symSvg(s.k)}</button>`).join('');
  el.querySelectorAll('.sym').forEach(bindSym);
}
function bindSym(btn){
  let start=null,moved=false;
  btn.addEventListener('pointerdown',e=>{if(S.place||S.draw||S.adjust)return;e.stopPropagation();start={x:e.clientX,y:e.clientY};moved=false;if(!S.locked&&S.sym!=='erase')btn.setPointerCapture(e.pointerId)});
  btn.addEventListener('pointermove',e=>{if(!start||S.locked||S.sym==='erase')return;if(!moved&&Math.hypot(e.clientX-start.x,e.clientY-start.y)<6)return;moved=true;
    const s=symsOf(S.mapId).find(x=>x.id===btn.dataset.id),pt=imgPt(e),m=curMap();let x=pt.x,y=pt.y;
    if(s.cab){const c=findCable(s.pin,s.cab);if(c){const n=nearestOnPolyline(c.pts,x,y);if(n.d<screenToImg(60)){x=n.x;y=n.y}else{delete s.pin;delete s.cab}}}
    s.x=x;s.y=y;btn.style.left=x/m.w*100+'%';btn.style.top=y/m.h*100+'%'});
  btn.addEventListener('pointerup',e=>{if(!start)return;e.stopPropagation();const id=btn.dataset.id;
    if(moved)scheduleSave();else if(Math.hypot(e.clientX-start.x,e.clientY-start.y)<8){if(S.sym==='erase')removeSym(id);else if(!S.sym)openSym(id)}
    start=null});
  btn.addEventListener('pointercancel',()=>{start=null});
  btn.addEventListener('click',e=>e.stopPropagation());
}
function removeSym(id){const m=meta(S.mapId);m.symbols=symsOf(S.mapId).filter(s=>s.id!==id);if(S.symSel===id){S.symSel=null;renderSheet()}scheduleSave();drawSyms()}
function openSym(id){S.pinId=null;S.cableId=null;S.symSel=id;renderSheet();drawAll()}
function renderSymSheet(el){
  const s=symsOf(S.mapId).find(x=>x.id===S.symSel);if(!s){S.symSel=null;el.innerHTML='';return}
  const k=sheetKeep(el,'s'+s.id),cabs=allCables(),cur=s.cab?s.pin+'|'+s.cab:'';
  el.innerHTML=`<div class="sheet cable${k.still}" role="dialog" aria-label="${esc(SYM[s.k].l)}"><div class="shead"><div class="bign" style="background:#fff;border:1.5px solid var(--line)">${symSvg(s.k,30)}</div><div class="st"><b>${esc(SYM[s.k].l)}${s.label?' '+esc(s.label):''}</b>${s.cab?esc(cableName(s.pin,s.cab)):'Not on a cable'}</div><button class="close" onclick="closeSheet()">Close</button></div>
   <div class="sbody"><label class="f" for="sy-k">Type</label><select id="sy-k" onchange="setSym('k',this.value)">${opts(SYMS.map(x=>[x.k,x.l]),s.k,null)}</select>
   <label class="f" for="sy-l">Label</label><input type="text" id="sy-l" value="${esc(s.label||'')}" placeholder="e.g. EL 14 or Kitchen sockets" oninput="setSym('label',this.value,true)">
   <label class="f" for="sy-c">On circuit</label><select id="sy-c" onchange="setSym('link',this.value)">${opt('','Not on a cable',cur)}${cabs.map(c=>opt(c.p.id+'|'+c.cb.id,cableName(c.p.id,c.cb.id),cur)).join('')}</select>
   <label class="f" for="sy-n">Notes</label><textarea id="sy-n" oninput="setSym('notes',this.value,true)">${esc(s.notes||'')}</textarea>
   <div class="row" style="margin-top:12px"><button class="btn small danger" onclick="armed(this,()=>{removeSym('${s.id}');closeSheet()})">Delete</button></div>
   <p class="hint">To move it, tap Unlocked and drag. Symbols on a cable slide along it.</p></div></div>`;k.restore();
}
function setSym(k,v,quiet){const s=symsOf(S.mapId).find(x=>x.id===S.symSel);if(!s)return;if(k==='link'){if(v){const[p,c]=v.split('|');s.pin=p;s.cab=c}else{delete s.pin;delete s.cab}}else s[k]=v;scheduleSave();drawSyms();if(!quiet)renderSheet()}
function quickClose(){const open=S.pinId||S.cableId||S.symSel;S.pinId=null;S.cableId=null;S.symSel=null;renderSheet();drawAll();clearTimeout(saveT);saveData().then(ok=>toast(ok?(open?'Closed and saved':'Saved'):'Not saved'))}
function symRows(){const rows=[['Map','Symbol','Label','DB ref','Circuit','Notes']];const keep=S.mapId;
  for(const m of allMaps()){S.mapId=m.id;for(const s of (meta(m.id).symbols||[])){const c=s.cab&&findCable(s.pin,s.cab);rows.push([m.name,(SYM[s.k]||{}).l||s.k,s.label||'',c?(BY_ASSET[c.p.asset]||{}).ref||'Pin '+c.p.num:'',c?cableName(s.pin,s.cab).split(' – ').slice(1).join(' – '):'',s.notes||''])}}

  for(const r of p.remedials||[]){for(const kind of ['invoices','beforePhotos','afterPhotos']){const g=(r[kind]||[]).find(x=>x.id===id);if(g)return{g,list:r[kind],rem:r}}}}return null}
async function getFileData(id){let v=await sget(KFILE+id);if(!v&&CLOUD){try{const j=await api('getFile',{id:'f_'+id});if(j.data){v=j.data;await sset(KFILE+id,v)}}catch(e){}}return v}

async function removeFile(id){const F=findFile(id);if(!F)return;await sdel(KFILE+id);F.list.splice(F.list.indexOf(F.g),1);scheduleSave();if(S.view2==='rem')openRemedials();else{closeOv();renderSheet()}}
async function addRemFile(mid,pid,rid,kind,inp){
  const p=pinsOf(mid).find(x=>x.id===pid),r=p.remedials.find(x=>x.id===rid),files=[...inp.files];if(!files.length)return;r[kind]=r[kind]||[];toast('Adding…');let n=0;
  for(const f of files){try{const id=uid(),raw=await readFile(f);let meta;
    if(f.type==='application/pdf'){if(raw.length>6e6){toast(f.name+' is too big. Photograph it instead.');continue}if(!await sset(KFILE+id,raw))continue;meta={id,name:f.name,type:'pdf'}}
    else{const big=await compressImage(raw,2000,.85),th=await compressImage(raw,240,.7);if(!await sset(KFILE+id,big.data))continue;meta={id,name:f.name,type:'img',thumb:th.data}}
    r[kind].push(meta);queueUpload(KFILE+id,'f_'+id);n++}catch(e){toast(f.name+' could not be read')}}

}

const QR_CDN='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
const XLSX_CDN='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const _scripts={};
function loadScript(src){return _scripts[src]||(_scripts[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>{delete _scripts[src];rej(new Error('Needs an internet connection the first time'))};document.head.appendChild(s)}))}
const siteName=()=>(data.site||{}).name||(CLOUD&&CLOUD.siteName)||DEFAULT_SITE;
function appLink(){const s=(data.site||{}).appUrl;if(s)return s;if(/^https?:/.test(location.protocol)&&!/claude\.ai|anthropic|claudeusercontent/.test(location.host))return location.origin+location.pathname;return ''}
const dbLink=a=>appLink()+'#db='+encodeURIComponent(a)+(CLOUD?'&site='+encodeURIComponent(CLOUD.site):'');
async function qrDataUrl(text,size){await loadScript(QR_CDN);const div=document.createElement('div');new QRCode(div,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});return div.querySelector('canvas').toDataURL('image/png')}
function fitText(x,t,X,Y,maxW,lh,lines){const words=String(t||'').split(/\s+/).filter(Boolean);let line='',n=0;
  for(let i=0;i<words.length;i++){const test=line?line+' '+words[i]:words[i];
    if(x.measureText(test).width>maxW&&line){if(n===lines-1){let r=words.slice(i-line.split(' ').length).join(' ');while(x.measureText(r+'…').width>maxW&&r.length>1)r=r.slice(0,-1);x.fillText(r+'…',X,Y+n*lh);return}x.fillText(line,X,Y+n*lh);n++;line=words[i]}else line=test}
  if(line){while(x.measureText(line).width>maxW&&line.length>1)line=line.slice(0,-1);x.fillText(line,X,Y+n*lh)}}
async function labelPng(asset){
  const d=BY_ASSET[asset],img=await loadImg(await qrDataUrl(dbLink(asset),480));
  const c=document.createElement('canvas');c.width=900;c.height=420;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,900,420);x.strokeStyle='#003F2D';x.lineWidth=8;x.strokeRect(4,4,892,412);x.drawImage(img,26,26,368,368);
  x.fillStyle='#003F2D';x.fillRect(410,26,464,48);x.fillStyle='#fff';x.font='600 26px Barlow, Arial, sans-serif';fitText(x,siteName(),424,60,440,30,1);
  x.fillStyle='#000';x.font='700 62px "Barlow Condensed", "Arial Narrow", Arial, sans-serif';fitText(x,d.ref,420,150,456,62,2);
  x.fillStyle='#333';x.font='500 28px Barlow, Arial, sans-serif';fitText(x,d.building,420,262,456,32,1);fitText(x,d.room,420,302,456,32,1);
  x.fillStyle='#666';x.font='500 22px monospace';if(!d.custom)x.fillText(d.asset,420,380);
  return c.toDataURL('image/png');
}

  try{const png=await labelPng(asset);ov.querySelector('.wrap').innerHTML=`<img src="${png}" alt="QR label for ${esc(d.ref)}" style="width:100%;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.15)">
    <div class="row" style="margin-top:12px"><a class="btn primary" href="${png}" download="QR-${esc(d.ref.replace(/[^\w-]+/g,'_'))}.png">Download label</a><button class="btn" onclick="printLabels(['${esc(asset)}'])">Print</button></div>
    <p class="hint">Scanning it with any phone camera opens this board in the app. Print on weatherproof label stock and stick it inside the DB door.</p><p class="hint" style="word-break:break-all">${esc(dbLink(asset))}</p>`}
  catch(e){ov.querySelector('.wrap').innerHTML=`<div class="warn">${esc(e.message)}</div>`}

let scanStream=null;
async function openScanner(){
  if(!('BarcodeDetector' in window)){toast('Scanning isn\'t supported here. Use your phone\'s camera app on the QR label instead.');return}
  const ov=document.getElementById('ovl');ov.innerHTML=`<div class="ov dark"><header><button class="hbtn" onclick="closeScanner()">‹ Back</button><h1>Scan a DB label</h1></header><div class="viewer" style="flex-direction:column"><video id="scanv" playsinline muted style="width:100%;max-height:75vh;object-fit:cover;background:#000"></video><p style="color:#ddd;text-align:center;padding:10px">Point the camera at the QR label on the board.</p></div></div>`;
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=document.getElementById('scanv');v.srcObject=scanStream;await v.play();

}
function closeScanner(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}closeOv()}
function handleScan(raw){const i=raw.indexOf('#'),q=new URLSearchParams(i>=0?raw.slice(i+1):(raw.split('?')[1]||''));const a=q.get('db');closeScanner();if(a)goToAssetOrBuilding(a);else toast('That QR code isn\'t a DB label')}
function goToAssetOrBuilding(a){const at=placed()[a];if(at){openMap(at.map.id,at.pin.id);return}const d=BY_ASSET[a];if(!d){toast('That board isn\'t on this site');return}
  const m=allMaps().find(x=>bKey(x)===d.building);if(m)openMap(m.id);toast(d.ref+' isn\'t placed on a map yet')}
function handleHash(){const q=new URLSearchParams(location.hash.slice(1)),a=q.get('db');if(a){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}goToAssetOrBuilding(a)}}

/* ============ visual board tree ============ */
function openTree(b){
  if(b)S.treeB=b;const blds=[...new Set(DBS.map(d=>d.building).filter(Boolean))].sort();if(!S.treeB||!blds.includes(S.treeB))S.treeB=blds[0];S.treeZ=S.treeZ||1;
  const pl=placed(),inB=DBS.filter(d=>d.building===S.treeB),scope=new Set(inB.map(d=>d.asset));
  const up=a=>{let p=parentOf(a),g=0;while(p&&p!=='SUPPLY'&&!scope.has(p)&&BY_ASSET[p]&&g++<60){scope.add(p);p=parentOf(p)}};
  const down=a=>{for(const c of childrenOf(a))if(!scope.has(c)&&BY_ASSET[c]){scope.add(c);down(c)}};
  inB.forEach(d=>{up(d.asset);down(d.asset)});
  const byRef=(x,y)=>(BY_ASSET[x]?.ref||'').localeCompare(BY_ASSET[y]?.ref||'',undefined,{numeric:true});
  const kidsOf=a=>childrenOf(a).filter(c=>scope.has(c)&&BY_ASSET[c]).sort(byRef);
  const linked=[...scope].filter(a=>BY_ASSET[a]&&(parentOf(a)||kidsOf(a).length));
  const loose=[...scope].filter(a=>BY_ASSET[a]&&!linked.includes(a)).sort(byRef);
  const seen=new Set(),mk=a=>{seen.add(a);return{a,kids:kidsOf(a).filter(c=>!seen.has(c)).map(mk)}};
  const roots=[],sup=linked.filter(a=>parentOf(a)==='SUPPLY').sort(byRef);
  if(sup.length)roots.push({root:'Main intake',sub:'Incoming supply',kids:sup.map(mk)});
  linked.filter(a=>!seen.has(a)&&parentOf(a)!=='SUPPLY'&&!(parentOf(a)&&scope.has(parentOf(a)))).sort(byRef).forEach(a=>{if(!seen.has(a))roots.push(mk(a))});
  const W=150,H=58,GX=14,GY=44;
  const meas=n=>{n.kids.forEach(meas);n.kw=n.kids.reduce((s,k)=>s+k.w,0)+GX*Math.max(0,n.kids.length-1);n.w=Math.max(W,n.kw)};
  const place=(n,x,y)=>{n.x=x+(n.w-W)/2;n.y=y;let cx=x+(n.w-n.kw)/2;n.kids.forEach(k=>{place(k,cx,y+H+GY);cx+=k.w+GX})};
  let X=0;roots.forEach(r=>{meas(r);place(r,X,0);X+=r.w+GX*3});
  const nodes=[],paths=[];let maxY=0;
  const walk=n=>{nodes.push(n);maxY=Math.max(maxY,n.y);if(n.kids.length){const px=n.x+W/2,py=n.y+H,my=py+GY/2,xs=n.kids.map(k=>k.x+W/2);
    paths.push(`M${px} ${py}V${my}`,`M${Math.min(...xs,px)} ${my}H${Math.max(...xs,px)}`,...n.kids.map(k=>`M${k.x+W/2} ${my}V${k.y}`))}n.kids.forEach(walk)};
  roots.forEach(walk);
  const TW=Math.max(X-GX*3,W),TH=maxY+H,z=S.treeZ;
  const nodeHtml=n=>{const st={left:n.x,top:n.y};if(n.root)return `<div class="tn root" style="left:${st.left}px;top:${st.top}px"><i style="background:#FFD200"></i><span><b>${esc(n.root)}</b>${esc(n.sub)}</span></div>`;
    const d=BY_ASSET[n.a],at=pl[n.a],s=at?pinStatus(at.pin):null;
    return `<button class="tn" style="left:${st.left}px;top:${st.top}px" onclick="goToAsset('${esc(n.a)}')" aria-label="${esc(d.ref)}, ${esc(d.room)}"><i style="background:${s?s.c:'#D5DCD8'}"></i><span><b>${esc(d.ref)}</b>${esc(d.room)}${d.building!==S.treeB?'<br>'+esc(d.building):''}${at?'':'<br><em>Not on a map</em>'}</span></button>`};
  let h=`<div class="ov"><header><button class="hbtn" onclick="closeOv();if(S.view!=='map')renderHome()">‹ Back</button><h1>Board tree</h1></header><div class="body"><div class="wrap" style="max-width:none">
   <div class="row" style="flex-wrap:nowrap"><select id="t-b" onchange="openTree(this.value)" aria-label="Building">${blds.map(x=>opt(x,x,S.treeB)).join('')}</select>
   <div class="zoom" style="box-shadow:none;border:1.5px solid var(--line);flex:none"><button onclick="S.treeZ=Math.max(.35,S.treeZ/1.25);openTree()" aria-label="Zoom out">−</button><button onclick="treeFit()" style="font-size:14px">Fit</button><button onclick="S.treeZ=Math.min(1.6,S.treeZ*1.25);openTree()" aria-label="Zoom in">+</button></div></div>`;
  if(roots.length)h+=`<div class="tv-wrap" id="tvw"><div style="width:${TW*z}px;height:${TH*z}px;position:relative"><div class="tv" style="width:${TW}px;height:${TH}px;transform:scale(${z})"><svg width="${TW}" height="${TH}" aria-hidden="true"><path d="${paths.join('')}"/></svg>${nodes.map(nodeHtml).join('')}</div></div></div>
   <p class="hint">Coloured stripes show check status. Tap a board to open it on the map.</p>`;
  else h+=`<div class="card">Nothing linked in ${esc(S.treeB)} yet. Open a board, go to Supply on its Board tab and choose what feeds it. Drawing a cable from one DB to another links them too.</div>`;
  if(loose.length)h+=`<h2>Not linked yet</h2><div class="row">${loose.map(a=>`<button class="btn small" onclick="goToAsset('${esc(a)}')">${esc(BY_ASSET[a].ref)}</button>`).join('')}</div>`;
  h+=`</div></div></div>`;
  document.getElementById('ovl').innerHTML=h;S.treeTW=TW;
}

function snapOf(R){const o={};for(const k in R){const r=R[k];o[k]=k.startsWith('kv:')?JSON.stringify(r.v):JSON.stringify(r,(kk,v)=>kk==='u'?undefined:v)}return o}
function stampChanges(){const R=dmFlatten(data),cur=snapOf(R),now=Date.now();let n=0;
  if(SNAP){for(const k in cur)if(SNAP[k]!==cur[k]){n++;if(k.startsWith('kv:')){const p=k.split(':');data.kvu[p[1]+':'+p.slice(2).join(':')]=now}else R[k].u=now}
    for(const k in SNAP)if(!(k in cur)){n++;data.tomb[k]=now}}
  SNAP=cur;return n}

function parseWhen(v){if(!v)return null;if(v instanceof Date&&!isNaN(v))return v;const s=String(v).trim();let m=s.match(/^(\d{1,2})[\s\/\-]([A-Za-z]{3,})[\s\/\-,]+(\d{4})/);

  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m)return new Date(+(m[3].length===2?'20'+m[3]:m[3]),+m[2]-1,+m[1]);const d=new Date(s);return isNaN(d)?null:d}

/* ============ progress report for managers ============ */
function reportRange(period){
  const wk=currentWeek(),ks=Object.keys(WEEKS).map(Number).sort((a,b)=>a-b),st=n=>WEEKS[n]?WEEKS[n][2]:null,t=today();
  if(period==='week'){const s=st(wk)||addDays(t,-6);return{from:s,to:addDays(s,6),label:WEEKS[wk]?`Week ${wk}, ${WEEKS[wk][0]} to ${WEEKS[wk][1]}`:'This week'}}
  if(period==='last'){const n=Math.max(ks[0]||1,wk-1),s=st(n)||addDays(t,-13);return{from:s,to:addDays(s,6),label:WEEKS[n]?`Week ${n}, ${WEEKS[n][0]} to ${WEEKS[n][1]}`:'Last week'}}
  if(period==='4w'){const n=Math.max(ks[0]||1,wk-3),s=st(n)||addDays(t,-27);return{from:s,to:t,label:`Last 4 weeks, ${fmt(s)} to ${fmt(t)}`}}
  const s=st(ks[0])||'2000-01-01';return{from:s,to:t,label:`Schedule to date, ${fmt(s)} to ${fmt(t)}`};
}
function reportModel(period){
  const R=reportRange(period),inP=s=>!!s&&s>=R.from&&s<=R.to,wk=currentWeek(),pl=placed();
  const signed=a=>{const at=pl[a];return !!(at&&at.pin.checks&&at.pin.checks.AF)};
  const sched=DBS.filter(d=>d.wk),due=sched.filter(d=>d.wk<=wk),overdue=sched.filter(d=>d.wk<wk&&!signed(d.asset));
  const allPins=allMaps().flatMap(m=>pinsOf(m.id).map(p=>({m,p})));
  const signedInP=allPins.filter(x=>x.p.checks&&x.p.checks.AF&&inP(x.p.checks.date));
  const engs=[...engNames()];if(sched.some(d=>!d.engineer))engs.push('');
  const byEng=engs.map(n=>{const ds=sched.filter(d=>(d.engineer||'')===n),du=ds.filter(d=>d.wk<=wk);
    return{n:n||'Unassigned',total:ds.length,due:du.length,done:du.filter(d=>signed(d.asset)).length,over:ds.filter(d=>d.wk<wk&&!signed(d.asset)).length,period:signedInP.filter(x=>((BY_ASSET[x.p.asset]||{}).engineer||'')===n).length}}).filter(e=>e.total||e.period);
  const bl={};for(const d of due){const b=bl[d.building]||(bl[d.building]={b:d.building,due:0,done:0});b.due++;if(signed(d.asset))b.done++}
  const byBld=Object.values(bl).sort((a,b)=>(b.due-b.done)-(a.due-a.done)||a.b.localeCompare(b.b)).slice(0,12);
  const rems=allRems(),open=rems.filter(x=>x.r.status!=='Completed'),codes={C1:0,C2:0,FI:0,C3:0,'':0};open.forEach(x=>codes[x.r.code||'']++);
  const order=['C1','C2','FI'],danger=open.filter(x=>order.includes(x.r.code)).sort((a,b)=>order.indexOf(a.r.code)-order.indexOf(b.r.code)||(a.r.raised||'').localeCompare(b.r.raised||''));
  const quoted=open.filter(x=>['Quoted','Approved'].includes(x.r.status)).reduce((s,x)=>s+(parseFloat(x.r.quote)||0),0);
  const rcd=allPins.map(x=>rcdDue(x.p)).filter(Boolean);
  const next=sched.filter(d=>d.wk===wk+1);
  return{R,wk,sched,due,done:due.filter(d=>signed(d.asset)).length,doneAll:sched.filter(d=>signed(d.asset)).length,overdue,signedInP,byEng,byBld,open,codes,danger,quoted,
    raisedP:rems.filter(x=>inP(x.r.raised)).length,compP:rems.filter(x=>x.r.status==='Completed'&&inP(x.r.completedDate)).length,
    rcdOver:rcd.filter(r=>r.days<0).length,rcdSoon:rcd.filter(r=>r.days>=0&&r.days<=30).length,
    next,nextByEng:engs.map(n=>{const ds=next.filter(d=>(d.engineer||'')===n);return{n:n||'Unassigned',c:ds.length,b:[...new Set(ds.map(d=>d.building))]}}).filter(x=>x.c),
    placedCount:sched.filter(d=>pl[d.asset]).length};
}
const money=v=>'£'+v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
function reportHtml(M,note){
  const G='#003F2D',F='Arial,Helvetica,sans-serif',pct=(a,b)=>b?Math.round(a/b*100):0,col=p=>p>=90?'#1E8A4C':p>=70?'#D98200':'#C8261E';
  const bar=(p,c)=>`<div style="background:#E4E9E5;border-radius:4px;height:10px;width:100%;min-width:60px"><div style="width:${Math.max(0,Math.min(100,p))}%;background:${c};height:10px;border-radius:4px"></div></div>`;
  const kpi=(v,l,c)=>`<td style="width:25%;padding:10px 6px;border:1px solid #D5DCD8;border-radius:6px;text-align:center;background:#fff;vertical-align:top"><div style="font:700 26px ${F};color:${c}">${v}</div><div style="font:12px ${F};color:#5A6862;margin-top:3px;line-height:1.3">${l}</div></td>`;
  const TH=`style="text-align:left;font:600 12px ${F};color:#5A6862;padding:6px;border-bottom:2px solid #D5DCD8"`,TD=`style="font:13px ${F};color:#15201C;padding:6px;border-bottom:1px solid #E4E9E5;vertical-align:middle"`;
  const h2=t=>`<h2 style="font:700 17px ${F};color:${G};margin:24px 0 8px">${t}</h2>`,P=t=>`<p style="font:14px ${F};color:#15201C;margin:6px 0;line-height:1.5">${t}</p>`;
  const overall=pct(M.done,M.due.length),dangerN=M.codes.C1+M.codes.C2+M.codes.FI;
  let h=`<div style="max-width:680px;margin:0 auto;background:#fff;color:#15201C">
  <div style="background:${G};color:#fff;padding:16px 18px;border-radius:8px 8px 0 0"><div style="font:600 13px ${F};color:#BFE3D2">${esc(siteName())}</div><div style="font:700 22px ${F};margin-top:2px;color:#fff">DB inspection progress</div><div style="font:13px ${F};color:#E0EEE7;margin-top:4px">${esc(M.R.label)}. Generated ${esc(new Date().toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))}.</div></div>
  <div style="padding:12px 16px 18px;border:1px solid #D5DCD8;border-top:0;border-radius:0 0 8px 8px">`;
  if(note&&note.trim())h+=`<div style="background:#F3F6F4;border-left:4px solid ${G};padding:10px 12px;font:14px ${F};margin:4px 0 10px;white-space:pre-wrap;line-height:1.5">${esc(note.trim())}</div>`;
  h+=`<table role="presentation" style="width:100%;border-collapse:separate;border-spacing:6px"><tr>${kpi(overall+'%','of boards due so far are signed off',col(overall))}${kpi(M.signedInP.length,'boards signed off in this period',G)}${kpi(M.overdue.length,'boards overdue',M.overdue.length?'#C8261E':'#1E8A4C')}${kpi(dangerN,'open C1, C2 or FI remedials',dangerN?'#C8261E':'#1E8A4C')}</tr></table>`;
  h+=P(`<b>${M.done} of ${M.due.length}</b> boards due by week ${M.wk} are signed off. Across the full schedule of ${M.sched.length} boards, <b>${M.doneAll}</b> are signed off (${pct(M.doneAll,M.sched.length)}%).`);
  if(M.byEng.length){h+=h2('Progress by engineer')+`<table style="width:100%;border-collapse:collapse"><tr><th ${TH}>Engineer</th><th ${TH}>Signed off / due</th><th ${TH} style="width:34%"></th><th ${TH}>Overdue</th><th ${TH}>This period</th></tr>`+
    M.byEng.map(e=>{const p=pct(e.done,e.due);return `<tr><td ${TD}><b>${esc(e.n)}</b></td><td ${TD}>${e.done} / ${e.due}</td><td ${TD}>${bar(p,col(p))}</td><td ${TD}${e.over?' style="font:700 13px '+F+';color:#C8261E;padding:6px;border-bottom:1px solid #E4E9E5"':''}>${e.over}</td><td ${TD}>${e.period}</td></tr>`}).join('')+`</table>`}
  if(M.byBld.length){h+=h2('Buildings with the most outstanding')+`<table style="width:100%;border-collapse:collapse"><tr><th ${TH}>Building</th><th ${TH}>Done / due</th><th ${TH} style="width:40%"></th></tr>`+
    M.byBld.map(b=>{const p=pct(b.done,b.due);return `<tr><td ${TD}>${esc(b.b)}</td><td ${TD}>${b.done} / ${b.due}</td><td ${TD}>${bar(p,col(p))}</td></tr>`}).join('')+`</table>`}
  h+=h2('Remedials')+P(`<b>${M.open.length}</b> open: ${M.codes.C1} C1, ${M.codes.C2} C2, ${M.codes.FI} FI, ${M.codes.C3} C3${M.codes['']?', '+M.codes['']+' not coded':''}. In this period ${plural(M.raisedP,'remedial')} ${M.raisedP===1?'was':'were'} raised and ${M.compP} completed.${M.quoted?' '+money(M.quoted)+' is quoted or approved and not yet done.':''}`);
  if(M.danger.length)h+=`<table style="width:100%;border-collapse:collapse;margin-top:6px"><tr><th ${TH}>Code</th><th ${TH}>Board</th><th ${TH}>Issue</th><th ${TH}>Status</th><th ${TH}>Open</th></tr>`+
    M.danger.slice(0,15).map(({m,p,r})=>{const d=BY_ASSET[p.asset]||{},rg=r.reg==='Other'?r.regOther:r.reg,age=r.raised?Math.max(0,-daysTo(r.raised)):null,cc=r.code==='C1'?'#C8261E':r.code==='C2'?'#E0662B':'#1565C0';
      return `<tr><td ${TD}><span style="background:${cc};color:#fff;font:700 12px ${F};padding:2px 6px;border-radius:3px">${esc(r.code)}</span></td><td ${TD}><b>${esc(d.ref||'Pin '+p.num)}</b><br><span style="color:#5A6862">${esc(d.building||m.name)}</span></td><td ${TD}>${esc([rg,r.obs].filter(Boolean).join(': ')||'No details')}</td><td ${TD}>${esc(r.status||'Open')}</td><td ${TD}>${age==null?'':plural(age,'day')}</td></tr>`}).join('')+`</table>`+(M.danger.length>15?P(`<span style="color:#5A6862">Plus ${M.danger.length-15} more in the remedials register.</span>`):'');
  h+=h2('RCD 6-monthly tests')+P(M.rcdOver||M.rcdSoon?`<b style="color:${M.rcdOver?'#C8261E':'#15201C'}">${M.rcdOver} overdue</b>, ${M.rcdSoon} due in the next 30 days.`:'None overdue or due in the next 30 days.');
  if(M.nextByEng.length)h+=h2(`Next week, week ${M.wk+1}`)+`<table style="width:100%;border-collapse:collapse"><tr><th ${TH}>Engineer</th><th ${TH}>Boards</th><th ${TH}>Where</th></tr>`+M.nextByEng.map(x=>`<tr><td ${TD}>${esc(x.n)}</td><td ${TD}>${x.c}</td><td ${TD}>${esc(x.b.join(', '))}</td></tr>`).join('')+`</table>`;
  h+=P(`<span style="color:#5A6862;font-size:12px">${M.placedCount} of ${M.sched.length} scheduled boards are placed on site maps. Figures count a board as done once an engineer has signed it off in DB Map.</span>`);
  return h+`</div></div>`;
}
function reportText(M,note){const pct=(a,b)=>b?Math.round(a/b*100):0;
  return [`DB inspection progress – ${siteName()}`,M.R.label,'',...(note&&note.trim()?[note.trim(),'']:[]),
   `${pct(M.done,M.due.length)}% of boards due so far are signed off (${M.done} of ${M.due.length}).`,`${M.signedInP.length} boards signed off in this period.`,`${M.overdue.length} boards overdue.`,
   `Remedials: ${M.open.length} open (C1 ${M.codes.C1}, C2 ${M.codes.C2}, FI ${M.codes.FI}, C3 ${M.codes.C3}).${M.quoted?' '+money(M.quoted)+' quoted, not yet done.':''}`,
   `RCD tests: ${M.rcdOver} overdue, ${M.rcdSoon} due in 30 days.`,'','By engineer:',...M.byEng.map(e=>`  ${e.n}: ${e.done} of ${e.due} signed off${e.over?', '+e.over+' overdue':''}`),
   ...(M.nextByEng.length?['',`Next week (week ${M.wk+1}):`,...M.nextByEng.map(x=>`  ${x.n}: ${plural(x.c,'board')}`)]:[])].join('\n')}
const repSubject=M=>`DB inspection progress – ${siteName()} – ${M.R.label}`;
function openReport(){
  S.view2='report';S.repP=S.repP||'week';const M=reportModel(S.repP),site=data.site||{};
  document.getElementById('ovl').innerHTML=`<div class="ov"><header><button class="hbtn" onclick="S.view2='';closeOv();renderHome()">‹ Back</button><h1>Progress report</h1>${SB()}</header><div class="body"><div class="wrap">
   <div class="grid2"><div><label class="f" for="rp-p">Period</label><select id="rp-p" onchange="S.repP=this.value;openReport()">${opts([['week','This week'],['last','Last week'],['4w','Last 4 weeks'],['all','Schedule to date']],S.repP,null)}</select></div>
   <div><label class="f" for="rp-to">Managers' emails</label><input type="text" id="rp-to" inputmode="email" placeholder="name@cbre.com, …" value="${esc(site.managers||'')}" oninput="data.site.managers=this.value;scheduleSave()"></div></div>
   <label class="f" for="rp-note">Comments for managers (optional)</label><textarea id="rp-note" placeholder="e.g. Rik off Tuesday, Reds boards moved to next week." oninput="S.repNote=this.value;clearTimeout(S.rpT);S.rpT=setTimeout(()=>{document.getElementById('repprev').innerHTML=reportHtml(reportModel(S.repP),S.repNote)},300)">${esc(S.repNote||'')}</textarea>
   <div class="row" style="margin-top:12px"><button class="btn primary" onclick="emailReport()">${CLOUD?'Email to managers':'Email summary'}</button><button class="btn" onclick="downloadReport()">Download</button><button class="btn" onclick="printReport()">Print or save as PDF</button><button class="btn" onclick="copyReport()">Copy text</button></div>
   ${CLOUD?`<label class="tog"><input type="checkbox" ${site.weeklyReport?'checked':''} onchange="data.site.weeklyReport=this.checked;scheduleSave();toast(this.checked?'Weekly email on':'Weekly email off')"> Email this week's report to managers every Monday at 8am</label><p class="hint">Sent by the team backend using the latest figures from the app. It needs the weekly email switched on once in the backend (see the setup guide).</p>`
     :`<p class="hint">Email summary opens your email app with a text version. Download gives the full report as a file you can attach. Connect to the team backend to send the full report by email, or have it sent every Monday.</p>`}
   <div id="repprev" style="margin-top:14px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.12)">${reportHtml(M,S.repNote)}</div>
  </div></div></div>`;updateSaveBtn();
}
const repEmails=()=>String((data.site||{}).managers||'').split(/[,;\s]+/).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
async function emailReport(){
  const to=repEmails(),M=reportModel(S.repP);if(!to.length){toast('Add at least one manager email first');document.getElementById('rp-to')?.focus();return}
  if(CLOUD){toast('Sending…');try{const j=await api('emailReport',{to:to.join(','),subject:repSubject(M),html:reportHtml(M,S.repNote)});toast('Report emailed to '+plural(j.sent||to.length,'manager'))}catch(e){toast('Could not send: '+e.message)}return}
  location.href=`mailto:${encodeURIComponent(to.join(','))}?subject=${encodeURIComponent(repSubject(M))}&body=${encodeURIComponent(reportText(M,S.repNote))}`;
}
function reportDoc(M){return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(repSubject(M))}</title></head><body style="margin:0;padding:16px;background:#EEF1EE">${reportHtml(M,S.repNote)}</body></html>`}
function downloadReport(){const M=reportModel(S.repP);download(`DB-progress-${siteName().replace(/[^\w]+/g,'-')}-${today()}.html`,reportDoc(M),'text/html');toast('Report downloaded')}
function printReport(){let w=document.getElementById('printwrap');if(!w){w=document.createElement('div');w.id='printwrap';document.body.appendChild(w)}w.className='rep';w.innerHTML=reportHtml(reportModel(S.repP),S.repNote);
  document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>{document.body.classList.remove('printing');w.className=''},500)},200)}
async function copyReport(){try{await navigator.clipboard.writeText(reportText(reportModel(S.repP),S.repNote));toast('Copied. Paste into an email or Teams.')}catch(e){toast('Copy was blocked. Try Download.')}}

/* ============ boot ============ */
function normalise(){
  data.maps=data.maps||{};data.custom=data.custom||[];data.customDbs=data.customDbs||[];KV_SECTIONS.forEach(x=>data[x]=data[x]||{});data.kvu=data.kvu||{};data.tomb=data.tomb||{};data.settings=data.settings||{autosave:true};
  for(const id in data.maps){const m=data.maps[id];if(m.building!==undefined){if(data.mapBuilding[id]===undefined)data.mapBuilding[id]=m.building;delete m.building}m.pins=m.pins||[];m.symbols=m.symbols||[];
    for(const p of m.pins){normPin(p);if(p.checks.AE&&!p.remedials.length){p.remedials.push({id:uid(),code:'',reg:'',regOther:'',obs:p.checks.AEnotes||'',action:ACTIONS.includes(p.checks.AE)?p.checks.AE:'',status:p.checks.AE==='Completed on site'?'Completed':'Open'});delete p.checks.AE}}}
  if(!data.engineers||!data.engineers.length)data.engineers=ENG.map((n,i)=>({id:engId(n),name:n,phone:'',email:'',o:i}));
  const seen={};let i=0;data.engineers=data.engineers.filter(e=>{if(!String(e.id).startsWith('eng_'))e.id=engId(e.name);if(e.o==null)e.o=i;i++;const k=e.name.toLowerCase();if(seen[k])return false;seen[k]=1;return true});
}
(async()=>{
  try{CLOUD=JSON.parse(await sget('dbmap:cloud')||'null')}catch(e){CLOUD=null}
  try{PENDING=JSON.parse(await sget('dbmap:pending')||'[]')}catch(e){PENDING=[]}
  const sc=await sget('dbmap:schedule');if(sc){try{loadSchedule(JSON.parse(sc))}catch(e){}}
  const raw=await sget(KEY);if(raw){try{data=JSON.parse(raw)}catch(e){}}
  normalise();SNAP=snapOf(dmFlatten(data));
  rebuildDbs();renderHome();handleHash();
  if(CLOUD)syncNow(true);
  setInterval(()=>{if(CLOUD&&document.visibilityState==='visible'&&!dirty&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))syncNow(true)},60000);
  window.addEventListener('online',()=>{if(CLOUD)syncNow(true)});
  window.addEventListener('hashchange',handleHash);
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
window.addEventListener('resize',()=>{if(S.view!=='map')return;const vp=document.getElementById('vp'),m=curMap();if(!vp||!m)return;S.minZ=Math.min(1,vp.clientHeight/(vp.clientWidth*(m.h/m.w)));setZoom(S.zoom)});
</script>
